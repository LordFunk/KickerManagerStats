<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fieberkurve & Season Placements</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 2rem 1rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #e9eff5, #f9fafc);
    min-height: 100vh;
    color: #222;
}

h1 {
    margin: 0 0 1rem;
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(90deg, #004e92, #000428);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    width: 100%;
    max-width: 1200px;
}

.chart-container {
    width: 90%;
    max-width: 1200px;
    height: 70vh;
    min-height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    padding: 1rem 1.5rem;
    position: relative;
    margin-bottom: 40px;
    box-sizing: border-box;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>
</head>

<body>

<h1>Endplatzierungen der letzten 5 Saisons</h1>

<div class="chart-container">
    <canvas id="endplatzierungChart"></canvas>
</div>

<script>

/* =========================
   SEASONS
========================= */

const seasonLabels = ['20/21', '21/22', '22/23', '23/24', '24/25', '25/26'];


/* =========================
   FINAL PLACEMENTS
========================= */

const finalPlacements = {
    'Markus': [2, 3, 2, 1, 5, 1],
    'Erwin': [4, 4, 1, 4, 2, 6],
    'Phil': [3, 1, 5, 5, 4, 3],
    'Didi': [5, 2, 7, 6, 10, 2],
    'Steffo': [null, 7, 4, 7, 9, 9],
    'Basti': [null, 5, 6, 3, 8, 8],
    'Eirik': [1, 6, 3, 8, 7, 4],
    'Emil': [null, null, null, 2, 3, 10],
    'Kempka': [null, null, null, null, 6, 5],
    'Espen': [null, null, null, null, 1, 11],
    'Alex': [null, null, null, null, null, 7]
};


/* =========================
   SEASON POINTS
========================= */

const seasonPoints = {
    'Markus': [1923, 1733, 1646, 2224, 1761, 2009],
    'Erwin': [1536, 1571, 1957, 1845, 1903, 1722],
    'Phil': [1720, 1826, 1430, 1671, 1788, 1967],
    'Didi': [1391, 1735, 1267, 1667, 1212, 1997],
    'Steffo': [null, 957, 1558, 1620, 1438, 1489],
    'Basti': [null, 1441, 1303, 1927, 1512, 1490],
    'Eirik': [1846, 1107, 1630, 1421, 1581, 1853],
    'Emil': [null, null, null, 2014, 1873, 1358],
    'Kempka': [null, null, null, null, 1750, 1823],
    'Espen': [null, null, null, null, 2042, 1125],
    'Alex': [null, null, null, null, null, 1660]
};


/* =========================
   COLORS
========================= */

const colors = [
    '#E41A1C',
    '#377EB8',
    '#4DAF4A',
    '#984EA3',
    '#FF7F00',
    '#A65628',
    '#F781BF',
    '#999999',
    '#66C2A5',
    '#FFD92F',
    '#000000'
];


/* =========================
   SELECTED PLAYERS
========================= */

const selectedPlayers = new Set();


/* =========================
   CREATE DATASETS
========================= */

const datasets = Object.entries(finalPlacements).map(
    ([name, data], index) => {

        const color = colors[index];

        return {
            label: name,

            data: data,

            points: seasonPoints[name],

            borderColor: color,
            backgroundColor: color,

            originalColor: color,
            originalBgColor: color,

            fill: false,

            tension: 0,

            spanGaps: true,

            pointRadius: 4,
            pointHoverRadius: 7,

            /* Circle markers */
            pointStyle: 'circle',

            borderWidth: 2
        };
    }
);


/* =========================
   CREATE CHART
========================= */

const ctx = document
    .getElementById('endplatzierungChart')
    .getContext('2d');


const chart = new Chart(ctx, {

    type: 'line',

    data: {
        labels: seasonLabels,
        datasets: datasets
    },

    options: {

        responsive: true,

        maintainAspectRatio: false,


        /* =========================
           HOVER BEHAVIOUR
        ========================= */

        interaction: {
            mode: 'index',
            intersect: false
        },


        /* =========================
           AXES
        ========================= */

        scales: {

            x: {

                title: {
                    display: true,
                    text: 'Saison'
                }

            },

            y: {

                reverse: true,

                beginAtZero: false,

                ticks: {
                    stepSize: 1
                },

                title: {
                    display: true,
                    text: 'Endplatzierung'
                }

            }

        },


        /* =========================
           PLUGINS
        ========================= */

        plugins: {

            /* =========================
               LEGEND
            ========================= */

            legend: {

                display: true,

                position: 'top',

                labels: {

                    usePointStyle: true,

                    pointStyle: 'circle'

                },


                /* =========================
                   LEGEND CLICK
                ========================= */

                onClick: function(event, legendItem) {

                    const index = legendItem.datasetIndex;

                    const dataset =
                        chart.data.datasets[index];

                    const name =
                        dataset.label;


                    if (selectedPlayers.has(name)) {

                        selectedPlayers.delete(name);

                    } else {

                        selectedPlayers.add(name);

                    }


                    const noneSelected =
                        selectedPlayers.size === 0;


                    chart.data.datasets.forEach(ds => {

                        const isSelected =
                            selectedPlayers.has(ds.label);


                        if (
                            noneSelected ||
                            isSelected
                        ) {

                            ds.borderColor =
                                ds.originalColor;

                            ds.backgroundColor =
                                ds.originalBgColor;

                            ds.borderWidth = 3;

                        } else {

                            ds.borderColor =
                                '#cccccc';

                            ds.backgroundColor =
                                '#cccccc';

                            ds.borderWidth = 1;

                        }

                    });


                    chart.update();

                }

            },


            /* =========================
               TOOLTIP
            ========================= */

            tooltip: {

                enabled: true,

                mode: 'index',

                intersect: false,

                /* =========================
                   CIRCLE MARKERS IN TOOLTIP
                ========================= */

                usePointStyle: true,

                boxWidth: 8,

                boxHeight: 8,


                /* =========================
                   SORT TOOLTIP
                   HIGHEST POINTS FIRST
                ========================= */

                itemSort: function(a, b) {

                    const seasonIndex =
                        a.dataIndex;


                    const pointsA =
                        seasonPoints[
                            a.dataset.label
                        ][seasonIndex];


                    const pointsB =
                        seasonPoints[
                            b.dataset.label
                        ][seasonIndex];


                    /*
                     * Players without points
                     * go to the bottom
                     */

                    if (
                        pointsA === null ||
                        pointsA === undefined
                    ) {
                        return 1;
                    }


                    if (
                        pointsB === null ||
                        pointsB === undefined
                    ) {
                        return -1;
                    }


                    /*
                     * Highest points first
                     */

                    return pointsB - pointsA;

                },


                /* =========================
                   TOOLTIP TEXT
                ========================= */

                callbacks: {

                    title: function(items) {

                        if (!items.length) {
                            return '';
                        }

                        return items[0].label;

                    },


                    label: function(context) {

                        const seasonIndex =
                            context.dataIndex;


                        const player =
                            context.dataset.label;


                        const points =
                            seasonPoints[player][seasonIndex];


                        /*
                         * Don't display players
                         * who weren't active
                         * that season
                         */

                        if (
                            points === null ||
                            points === undefined
                        ) {

                            return null;

                        }


                        return player +
                            ': ' +
                            points +
                            ' pts';

                    },


                    /* =========================
                       FORCE CIRCLE POINT STYLE
                       (per-item, overrides
                       Chart.js' per-dataset
                       pointStyle lookup)
                    ========================= */

                    labelPointStyle: function(context) {

                        return {
                            pointStyle: 'circle',
                            rotation: 0
                        };

                    }

                }

            }

        }

    }

});

</script>

</body>
</html>
