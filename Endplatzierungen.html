```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Curve & Season Placements</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#050505;
    --card:#101010;
    --card2:#151515;
    --line:rgba(255,255,255,.09);
    --text:#f5f5f5;
    --muted:#858585;
    --red:#e30613;
    --red-dark:#a9000b;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    line-height:1.5;
}


/* =========================
   NAVIGATION
========================= */

.nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    z-index:1000;
}

.nav-inner{
    max-width:1400px;
    height:100%;
    margin:auto;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:700;
    letter-spacing:.5px;
}

.logo span{
    color:var(--red);
}

.nav-links{
    display:flex;
    gap:28px;
}

.nav-links a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.nav-links a:hover{
    color:white;
}


/* =========================
   MAIN
========================= */

section{
    max-width:1400px;
    margin:0 auto;
    padding:110px 30px 70px;
}

.section-title{
    margin:0 0 10px;
    font-size:38px;
    font-weight:700;
    letter-spacing:-1px;
}

.section-subtitle{
    margin:0 0 40px;
    color:var(--muted);
    font-size:15px;
}

.red{
    color:var(--red);
}


/* =========================
   HEADER
========================= */

.page-header{
    border-bottom:1px solid var(--line);
    padding-top:130px;
    padding-bottom:45px;
}

.page-header-inner{
    max-width:1400px;
    margin:0 auto;
    padding:0 30px;
}

.page-label{
    color:var(--red);
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:15px;
}

h1{
    margin:0;
    font-size:52px;
    line-height:1;
    font-weight:700;
    letter-spacing:-2px;
}

.page-description{
    margin:18px 0 0;
    color:var(--muted);
    font-size:15px;
}


/* =========================
   CHART CARD
========================= */

.chart-section{
    padding-top:45px;
}

.chart-container{
    width:100%;
    height:70vh;
    min-height:500px;
    background:linear-gradient(
        145deg,
        var(--card),
        var(--card2)
    );
    border:1px solid var(--line);
    border-radius:12px;
    padding:30px;
    position:relative;
    box-sizing:border-box;
}

.chart-container canvas{
    width:100% !important;
    height:100% !important;
}


/* =========================
   CHART.JS
========================= */

.chart-container .chartjs-render-monitor{
    background:transparent;
}


/* =========================
   FOOTER
========================= */

footer{
    border-top:1px solid var(--line);
    padding:35px 30px;
    text-align:center;
    color:#555;
    font-size:12px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

    .nav{
        height:auto;
    }

    .nav-inner{
        padding:15px 20px;
        flex-direction:column;
        gap:12px;
    }

    .nav-links{
        gap:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .page-header{
        padding-top:150px;
        padding-bottom:35px;
    }

    .page-header-inner{
        padding-left:20px;
        padding-right:20px;
    }

    h1{
        font-size:40px;
        letter-spacing:-1.5px;
    }

    .chart-section{
        padding-left:20px;
        padding-right:20px;
        padding-top:30px;
    }

    .chart-container{
        height:70vh;
        min-height:500px;
        padding:20px;
    }

}


/* =========================
   SCROLL ANIMATION
========================= */

.reveal{
    opacity:0;
    transform:translateY(25px);
    transition:
        opacity .7s ease,
        transform .7s ease;
}

.reveal.visible{
    opacity:1;
    transform:translateY(0);
}

</style>
</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="nav">

    <div class="nav-inner">

        <a class="logo" href="index.html">
            Kicker <span>Stats</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#chart">Statistics</a>
        </div>

    </div>

</nav>


<!-- =========================
     PAGE HEADER
========================= -->

<header class="page-header">

    <div class="page-header-inner reveal">

        <div class="page-label">
            Historical Results
        </div>

        <h1>
            Final Standings
        </h1>

        <p class="page-description">
            Historical finishing positions across all seasons.
        </p>

    </div>

</header>


<!-- =========================
     CHART
========================= -->

<section class="chart-section" id="chart">

    <div class="section-title reveal">
        Season <span class="red">Placements</span>
    </div>

    <p class="section-subtitle reveal">
        Final league positions for every player across all seasons.
    </p>

    <div class="chart-container reveal">

        <canvas id="finalPlacementChart"></canvas>

    </div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>
    Kicker Interactive Stats
</footer>


<script>

/* =========================
   SEASONS
========================= */

const seasonLabels = ['20/21', '21/22', '22/23', '23/24', '24/25', '25/26'];


/* =========================
   FINAL PLACEMENTS
========================= */

const finalPlacements = {
    'Markus': [2, 3, 2, 1, 5, 1],
    'Erwin': [4, 4, 1, 4, 2, 6],
    'Phil': [3, 1, 5, 5, 4, 3],
    'Didi': [5, 2, 7, 6, 10, 2],
    'Steffo': [null, 7, 4, 7, 9, 9],
    'Basti': [null, 5, 6, 3, 8, 8],
    'Eirik': [1, 6, 3, 8, 7, 4],
    'Emil': [null, null, null, 2, 3, 10],
    'Kempka': [null, null, null, null, 6, 5],
    'Espen': [null, null, null, null, 1, 11],
    'Alex': [null, null, null, null, null, 7]
};


/* =========================
   SEASON POINTS
========================= */

const seasonPoints = {
    'Markus': [1923, 1733, 1646, 2224, 1761, 2009],
    'Erwin': [1536, 1571, 1957, 1845, 1903, 1722],
    'Phil': [1720, 1826, 1430, 1671, 1788, 1967],
    'Didi': [1391, 1735, 1267, 1667, 1212, 1997],
    'Steffo': [null, 957, 1558, 1620, 1438, 1489],
    'Basti': [null, 1441, 1303, 1927, 1512, 1490],
    'Eirik': [1846, 1107, 1630, 1421, 1581, 1853],
    'Emil': [null, null, null, 2014, 1873, 1358],
    'Kempka': [null, null, null, null, 1750, 1823],
    'Espen': [null, null, null, null, 2042, 1125],
    'Alex': [null, null, null, null, null, 1660]
};


/* =========================
   COLORS
========================= */

const colors = [
    '#E41A1C',
    '#377EB8',
    '#4DAF4A',
    '#984EA3',
    '#FF7F00',
    '#A65628',
    '#F781BF',
    '#999999',
    '#66C2A5',
    '#FFD92F',
    '#000000'
];


/* =========================
   SELECTED PLAYERS
========================= */

const selectedPlayers = new Set();


/* =========================
   CREATE DATASETS
========================= */

const datasets = Object.entries(finalPlacements).map(
    ([name, data], index) => {

        const color = colors[index];

        return {
            label: name,

            data: data,

            points: seasonPoints[name],

            borderColor: color,
            backgroundColor: color,

            originalColor: color,
            originalBgColor: color,

            fill: false,

            tension: 0,

            spanGaps: true,

            pointRadius: 4,
            pointHoverRadius: 7,

            pointStyle: 'circle',

            borderWidth: 2
        };
    }
);


/* =========================
   CREATE CHART
========================= */

const ctx = document
    .getElementById('finalPlacementChart')
    .getContext('2d');


const chart = new Chart(ctx, {

    type: 'line',

    data: {
        labels: seasonLabels,
        datasets: datasets
    },

    options: {

        responsive: true,

        maintainAspectRatio: false,


        /* =========================
           HOVER BEHAVIOUR
        ========================= */

        interaction: {
            mode: 'index',
            intersect: false
        },


        /* =========================
           AXES
        ========================= */

        scales: {

            x: {

                title: {
                    display: true,
                    text: 'Season',
                    color: '#858585'
                },

                ticks: {
                    color: '#858585'
                },

                grid: {
                    color: 'rgba(255,255,255,.07)'
                }

            },

            y: {

                reverse: true,

                beginAtZero: false,

                ticks: {
                    stepSize: 1,
                    color: '#858585'
                },

                title: {
                    display: true,
                    text: 'Final Placement',
                    color: '#858585'
                },

                grid: {
                    color: 'rgba(255,255,255,.07)'
                }

            }

        },


        /* =========================
           PLUGINS
        ========================= */

        plugins: {

            /* =========================
               LEGEND
            ========================= */

            legend: {

                display: true,

                position: 'top',

                labels: {

                    color: '#f5f5f5',

                    usePointStyle: true,

                    pointStyle: 'circle',

                    padding: 18

                },


                /* =========================
                   LEGEND CLICK
                ========================= */

                onClick: function(event, legendItem) {

                    const index = legendItem.datasetIndex;

                    const dataset =
                        chart.data.datasets[index];

                    const name =
                        dataset.label;


                    if (selectedPlayers.has(name)) {

                        selectedPlayers.delete(name);

                    } else {

                        selectedPlayers.add(name);

                    }


                    const noneSelected =
                        selectedPlayers.size === 0;


                    chart.data.datasets.forEach(ds => {

                        const isSelected =
                            selectedPlayers.has(ds.label);


                        if (
                            noneSelected ||
                            isSelected
                        ) {

                            ds.borderColor =
                                ds.originalColor;

                            ds.backgroundColor =
                                ds.originalBgColor;

                            ds.borderWidth = 3;

                        } else {

                            ds.borderColor =
                                '#555555';

                            ds.backgroundColor =
                                '#555555';

                            ds.borderWidth = 1;

                        }

                    });


                    chart.update();

                }

            },


            /* =========================
               TOOLTIP
            ========================= */

            tooltip: {

                enabled: true,

                mode: 'index',

                intersect: false,

                usePointStyle: true,

                boxWidth: 8,

                boxHeight: 8,


                /* =========================
                   SORT TOOLTIP
                   HIGHEST POINTS FIRST
                ========================= */

                itemSort: function(a, b) {

                    const seasonIndex =
                        a.dataIndex;


                    const pointsA =
                        seasonPoints[
                            a.dataset.label
                        ][seasonIndex];


                    const pointsB =
                        seasonPoints[
                            b.dataset.label
                        ][seasonIndex];


                    if (
                        pointsA === null ||
                        pointsA === undefined
                    ) {
                        return 1;
                    }


                    if (
                        pointsB === null ||
                        pointsB === undefined
                    ) {
                        return -1;
                    }


                    return pointsB - pointsA;

                },


                /* =========================
                   TOOLTIP TEXT
                ========================= */

                callbacks: {

                    title: function(items) {

                        if (!items.length) {
                            return '';
                        }

                        return items[0].label;

                    },


                    label: function(context) {

                        const seasonIndex =
                            context.dataIndex;


                        const player =
                            context.dataset.label;


                        const points =
                            seasonPoints[player][seasonIndex];


                        if (
                            points === null ||
                            points === undefined
                        ) {

                            return null;

                        }


                        return player +
                            ': ' +
                            points +
                            ' pts';

                    },


                    /* =========================
                       FORCE CIRCLE POINT STYLE
                    ========================= */

                    labelPointStyle: function(context) {

                        return {
                            pointStyle: 'circle',
                            rotation: 0
                        };

                    }

                }

            }

        }

    }

});


/* =========================
   SCROLL ANIMATION
========================= */

const observer = new IntersectionObserver(
    entries => {

        entries.forEach(entry => {

            if(entry.isIntersecting){

                entry.target.classList.add("visible");

            }

        });

    },
    {
        threshold:0.12
    }
);


document.querySelectorAll(".reveal").forEach(element => {

    observer.observe(element);

});

</script>

</body>
</html>
```
