<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saisonpunkte 25-26</title>
<style>
:root{--bg:#fff;--card:#f7f7f7;--text:#222;--muted:#777;--border:#ddd;--grid:#ddd;--accent:#444;--tooltip:#222;--tooltipText:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#181818;--card:#242424;--text:#eee;--muted:#aaa;--border:#444;--grid:#444;--accent:#bbb;--tooltip:#eee;--tooltipText:#111}}
[data-theme=dark]{--bg:#181818;--card:#242424;--text:#eee;--muted:#aaa;--border:#444;--grid:#444;--accent:#bbb;--tooltip:#eee;--tooltipText:#111}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,sans-serif;margin:0;padding:20px;background:var(--bg);color:var(--text)}
h1{text-align:center;margin:0 0 18px;font-size:1.7rem}
.chart-card,.table-block{background:var(--card);border:1px solid var(--border);border-radius:10px}
.chart-card{padding:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.legend-item{border:1px solid transparent;border-radius:6px;padding:4px 7px;cursor:pointer;font-size:.82rem}
.legend-item:hover,.legend-item.active{border-color:currentColor;font-weight:700}
.legend-item.dimmed{opacity:.3}
.legend-swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.chart-wrap{position:relative;width:100%;height:500px}
.chart-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.tooltip{position:absolute;pointer-events:none;background:var(--tooltip);color:var(--tooltipText);border-radius:8px;padding:8px 10px;font-size:.8rem;line-height:1.5;box-shadow:0 4px 12px #0004;opacity:0;white-space:nowrap;z-index:5}
.tooltip.visible{opacity:1}
.tooltip-title{font-weight:700;margin-bottom:3px}
.tooltip-row{display:flex;align-items:center;gap:5px}
.tooltip-swatch{width:8px;height:8px;border-radius:50%;display:inline-block}
.controls{margin:16px 0;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.controls-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.range-label{font-size:.9rem}
.range-label span{font-weight:700}
.reset-btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:5px;padding:5px 10px;cursor:pointer}
.reset-btn:hover{background:var(--border)}
.range-slider{position:relative;height:30px}
.slider-track,.slider-range{position:absolute;top:13px;height:4px;border-radius:4px}
.slider-track{left:0;right:0;background:var(--border)}
.slider-range{background:var(--accent)}
.range-slider input{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;background:none;pointer-events:none;appearance:none}
.range-slider input::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;pointer-events:auto}
.range-slider input::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--accent);cursor:pointer;pointer-events:auto}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.tables-wrapper{display:grid;grid-template-columns:1fr;gap:14px}
.table-block{padding:12px;overflow:hidden}
.table-title,.static-heading{font-weight:700;margin-bottom:8px}
.static-heading{font-size:1.1rem;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:6px 7px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.diff-up{color:#16833b}.diff-down{color:#c33}.diff-flat{color:var(--muted)}
.table-block-half{margin-top:14px}
@media(max-width:768px){body{padding:10px}.chart-wrap{height:400px}.legend-item{font-size:.75rem}.controls-top{gap:10px}.table-block{overflow-x:auto}}
</style>
</head>
<body>

<h1>Saisonpunkte 25-26</h1>

<div class="chart-card">
<div id="legend" class="legend"></div>
<div id="chartWrap" class="chart-wrap"><div id="tooltip" class="tooltip"></div></div>
</div>

<div class="controls">
<div class="controls-top">
<div class="range-label">Spieltage: <span id="rangeMinLabel">1</span> – <span id="rangeMaxLabel">34</span></div>
<button id="reset" class="reset-btn">Reset</button>
</div>
<div class="range-slider">
<div class="slider-track"></div>
<div id="sliderRange" class="slider-range"></div>
<input id="rangeMin" type="range" min="1" max="34" value="1">
<input id="rangeMax" type="range" min="1" max="34" value="34">
</div>
<div class="ticks"><span>1</span><span>34</span></div>
</div>

<div id="tablesContainer" class="tables-wrapper"></div>
<div id="staticTablesContainer"></div>

<script>
const P={
Markus:[63,131,214,277,355,395,411,493,568,613,657,683,750,798,838,907,980,1012,1055,1087,1189,1262,1327,1379,1455,1495,1607,1666,1736,1796,1849,1899,1960,2009],
Erwin:[48,118,169,247,285,295,352,417,447,488,541,600,620,684,740,807,860,878,909,943,1044,1068,1132,1162,1221,1264,1320,1382,1433,1501,1530,1582,1617,1722],
Phil:[76,148,212,270,363,405,439,482,516,571,623,643,713,805,881,932,994,1012,1065,1113,1176,1242,1317,1351,1413,1454,1535,1604,1666,1741,1796,1852,1896,1967],
Didi:[50,110,195,265,310,348,392,463,491,515,566,629,685,748,789,876,958,989,1036,1083,1187,1257,1336,1415,1456,1519,1588,1643,1716,1757,1811,1881,1928,1997],
Steffo:[53,108,158,202,252,274,302,347,402,456,509,564,591,628,668,715,743,772,819,883,914,960,982,1006,1075,1109,1160,1219,1257,1321,1356,1382,1432,1489],
Basti:[47,100,144,206,273,301,338,377,423,454,493,546,597,625,665,735,766,799,813,855,908,971,997,1025,1073,1095,1145,1173,1208,1278,1330,1352,1406,1490],
Eirik:[46,82,116,180,217,282,356,428,492,526,602,650,706,725,752,796,828,854,893,934,983,1025,1091,1156,1217,1268,1352,1448,1534,1614,1667,1739,1774,1853],
Emil:[61,118,136,171,210,212,238,248,262,295,349,395,414,481,543,618,664,704,744,775,844,885,929,992,1059,1081,1138,1160,1184,1247,1276,1290,1324,1358],
Kempka:[36,99,131,186,241,269,324,389,429,454,518,564,606,662,672,715,767,798,855,902,978,1026,1106,1158,1208,1256,1337,1417,1502,1574,1649,1703,1736,1823],
Espen:[57,102,149,198,249,251,292,353,410,422,474,499,528,575,591,632,665,678,706,741,792,821,854,850,870,909,913,931,953,969,1001,1032,1057,1125],
Alex:[55,121,169,194,245,322,344,395,443,507,543,585,611,641,688,746,795,847,893,949,1016,1057,1134,1173,1230,1273,1338,1395,1448,1511,1546,1602,1626,1660]
};

const C=['#E41A1C','#377EB8','#4DAF4A','#984EA3','#FF7F00','#A65628','#E7298A','#999999','#66C2A5','#B8860B','#4363d8'];
const N=Object.keys(P),active=new Set(N);
const $=id=>document.getElementById(id), svg=(t,a={})=>{let e=document.createElementNS('http://www.w3.org/2000/svg',t);for(let k in a)e.setAttribute(k,a[k]);return e};
const legend=$('legend'),wrap=$('chartWrap'),tip=$('tooltip');

function buildLegend(){
 legend.innerHTML=N.map((n,i)=>`<div class="legend-item active" data-p="${n}" style="color:${C[i]}"><span class="legend-swatch" style="background:${C[i]}"></span>${n}</div>`).join('');
 legend.querySelectorAll('.legend-item').forEach(e=>e.onclick=()=>{
  let n=e.dataset.p;active.has(n)?active.delete(n):active.add(n);
  if(!active.size)active.add(n);
  updateLegend();refresh();
 });
}
function updateLegend(){legend.querySelectorAll('.legend-item').forEach(e=>e.classList.toggle('active',active.has(e.dataset.p)))}

function nice(min,max,count=7){
 let s=(max-min)/count,p=10**Math.floor(Math.log10(s)),r=s/p;
 r=r<1.5?1:r<3?2:r<7?5:10;
 let st=r*p,a=Math.floor(min/st)*st,z=Math.ceil(max/st)*st,o=[];
 for(let x=a;x<=z+.001;x+=st)o.push(x);
 return o;
}

function renderChart(start,end){
 let W=wrap.clientWidth,H=wrap.clientHeight,pad={l:52,r:16,t:16,b:34},w=W-pad.l-pad.r,h=H-pad.t-pad.b;
 let all=N.flatMap(n=>P[n].slice(start-1,end)),min=Math.min(...all),max=Math.max(...all),d=(max-min)||1,min-=d*.08,max+=d*.08;
 const X=i=>pad.l+(i-(start-1))*w/Math.max(1,end-start),Y=v=>pad.t+h-(v-min)*h/(max-min);
 let S=svg('svg',{viewBox:`0 0 ${W} ${H}`});
 nice(min,max).forEach(v=>{
  S.append(svg('line',{x1:pad.l,x2:W-pad.r,y1:Y(v),y2:Y(v),stroke:'var(--grid)','stroke-width':1}));
  let t=svg('text',{x:pad.l-8,y:Y(v)+4,'text-anchor':'end',fill:'var(--muted)','font-size':11});t.textContent=Math.round(v);S.append(t);
 });
 for(let md=start;md<=end;md++){
  let x=X(md-1);
  if(md>start)S.append(svg('line',{x1:x,x2:x,y1:pad.t,y2:H-pad.b,stroke:'var(--grid)','stroke-width':1}));
  let t=svg('text',{x,y:H-10,'text-anchor':'middle',fill:'var(--muted)','font-size':10});t.textContent=md;S.append(t);
 }
 S.append(svg('line',{x1:pad.l,x2:W-pad.r,y1:H-pad.b,y2:H-pad.b,stroke:'var(--accent)'}));
 S.append(svg('line',{x1:pad.l,x2:pad.l,y1:pad.t,y2:H-pad.b,stroke:'var(--accent)'}));

 N.forEach((n,i)=>{
  let pts=P[n].slice(start-1,end).map((v,j)=>`${X(start+j-1)},${Y(v)}`).join(' ');
  let line=svg('polyline',{points:pts,fill:'none',stroke:C[i],'stroke-width':active.has(n)?2.5:1.5,opacity:active.has(n)?1:.18});
  S.append(line);
  if(end-start<40)P[n].slice(start-1,end).forEach((v,j)=>S.append(svg('circle',{cx:X(start+j-1),cy:Y(v),r:active.has(n)?3:2,fill:C[i],opacity:active.has(n)?1:.18})));
 });

 let hit=svg('g');
 for(let md=start;md<=end;md++){
  let x=X(md-1),bw=w/Math.max(1,end-start),r=svg('rect',{x:x-bw/2,y:pad.t,width:bw,height:h,fill:'transparent'});
  const show=e=>{
   let rows=N.map((n,i)=>({n,v:P[n][md-1],i})).sort((a,b)=>b.v-a.v);
   tip.innerHTML=`<div class="tooltip-title">Spieltag ${md}</div>`+rows.map(o=>`<div class="tooltip-row" style="opacity:${active.has(o.n)?1:.45}"><span class="tooltip-swatch" style="background:${C[o.i]}"></span>${o.n}: ${o.v}</div>`).join('');
   tip.classList.add('visible');
   let rb=wrap.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight,xp=e.clientX-rb.left,yp=e.clientY-rb.top;
   let left=md<=17?xp+76:xp-76-tw;
   tip.style.left=Math.max(4,Math.min(left,W-tw-4))+'px';
   tip.style.top=Math.max(4,Math.min(yp-th/2,H-th-4))+'px';
  };
  r.onmouseenter=show;r.onmousemove=show;r.onmouseleave=()=>tip.classList.remove('visible');
  r.ontouchstart=e=>{e.preventDefault();show(e.touches[0])};
  hit.append(r);
 }
 S.append(hit);wrap.querySelector('svg')?.remove();wrap.insertBefore(S,tip);
}

function table(start,end,title){
 let rows=N.map((n,i)=>({n,v:P[n][end-1],old:P[n][start-2]??0,i})).sort((a,b)=>b.v-a.v);
 return `<div class="table-block"><div class="table-title">${title}</div><table><tr><th>#</th><th>Player</th><th>Punkte</th><th>Diff.</th></tr>${rows.map((o,i)=>`<tr><td>${i+1}</td><td><span class="legend-swatch" style="background:${C[o.i]}"></span>${o.n}</td><td>${o.v}</td><td class="${o.v>o.old?'diff-up':o.v<o.old?'diff-down':'diff-flat'}">${o.v-o.old>0?'+':''}${o.v-o.old}</td></tr>`).join('')}</table></div>`;
}

function renderTable(start,end){
 $('tablesContainer').innerHTML=table(start,end,`Spieltage ${start}–${end}`);
}

function renderStatic(){
 let make=(a,b,t)=>table(a,b,t);
 $('staticTablesContainer').innerHTML=`<div class="static-heading">Halbjahres-Tabellen</div><div class="tables-wrapper"><div class="table-block">${make(1,17,'Hinrunde')}</div><div class="table-block">${make(18,34,'Rückrunde')}</div></div>`;
}

function updateSlider(){
 let a=+$('rangeMin').value,b=+$('rangeMax').value;
 if(a>b){[a,b]=[b,a];$('rangeMin').value=a;$('rangeMax').value=b}
 $('rangeMinLabel').textContent=a;$('rangeMaxLabel').textContent=b;
 $('sliderRange').style.left=((a-1)/33*100)+'%';
 $('sliderRange').style.right=((34-b)/33*100)+'%';
 return[a,b];
}
function refresh(){let [a,b]=updateSlider();renderChart(a,b);renderTable(a,b)}

$('rangeMin').oninput=refresh;
$('rangeMax').oninput=refresh;
$('reset').onclick=()=>{$('rangeMin').value=1;$('rangeMax').value=34;refresh()};
window.onresize=refresh;

buildLegend();
renderStatic();
refresh();
</script>
</body>
</html>
