<!DOCTYPE html>
<html lang="en">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:'Segoe UI',Roboto,sans-serif;
margin:0;
padding:0;
background:linear-gradient(135deg,#e9eff5,#f9fafc);

.range-display{

}

.table-block{
width:100%;
}

.table-title{
text-align:center;

margin-bottom:8px;

}

table{
width:100%;
border-collapse:collapse;

}

}

</style>
</head>

<body>

<h1>Saisonpunkte 25-26</h1>

<div class="chart-container">
<canvas id="fieberkurveChart"></canvas>
</div>

<div class="slider-container">

<div class="slider-title">
Matchday auswählen
</div>

<div class="slider-row">

<div class="slider-block">

<div class="slider-label">
<span>Start Spieltag</span>
<span class="slider-value" id="startValue">1</span>
</div>

<input
type="range"
id="startSlider"
min="1"
max="34"
value="1"
>

</div>

<div class="slider-block">

<div class="slider-label">
<span>Ende Spieltag</span>
<span class="slider-value" id="endValue">34</span>
</div>

<input
type="range"
id="endSlider"
min="1"
max="34"
value="34"
>

</div>

</div>

<div class="range-display" id="rangeDisplay">
Spieltag 1 bis 34
</div>

</div>

<div class="tables-wrapper" id="tablesContainer"></div>

<script>

const playerPoints={

'Markus':[63,131,214,277,355,395,411,493,568,613,657,683,750,798,838,907,980,1012,1055,1087,1189,1262,1327,1379,1455,1495,1607,1666,1736,1796,1849,1899,1960,2009],

'Erwin':[48,118,169,247,285,295,352,417,447,488,541,600,620,684,740,807,860,878,909,943,1044,1068,1132,1162,1221,1264,1320,1382,1433,1501,1530,1582,1617,1722],

'Phil':[76,148,212,270,363,405,439,482,516,571,623,643,713,805,881,932,994,1012,1065,1113,1176,1242,1317,1351,1413,1454,1535,1604,1666,1741,1796,1852,1896,1967],

'Didi':[50,110,195,265,310,348,392,463,491,515,566,629,685,748,789,876,958,989,1036,1083,1187,1257,1336,1415,1456,1519,1588,1643,1716,1757,1811,1881,1928,1997],

'Steffo':[53,108,158,202,252,274,302,347,402,456,509,564,591,628,668,715,743,772,819,883,914,960,982,1006,1075,1109,1160,1219,1257,1321,1356,1382,1432,1489],

'Basti':[47,100,144,206,273,301,338,377,423,454,493,546,597,625,665,735,766,799,813,855,908,971,997,1025,1073,1095,1145,1173,1208,1278,1330,1352,1406,1490],

'Eirik':[46,82,116,180,217,282,356,428,492,526,602,650,706,725,752,796,828,854,893,934,983,1025,1091,1156,1217,1268,1352,1448,1534,1614,1667,1739,1774,1853],

'Emil':[61,118,136,171,210,212,238,248,262,295,349,395,414,481,543,618,664,704,744,775,844,885,929,992,1059,1081,1138,1160,1184,1247,1276,1290,1324,1358],

'Kempka':[36,99,131,186,241,269,324,389,429,454,518,564,606,662,672,715,767,798,855,902,978,1026,1106,1158,1208,1256,1337,1417,1502,1574,1649,1703,1736,1823],

'Espen':[57,102,149,198,249,251,292,353,410,422,474,499,528,575,591,632,665,678,706,741,792,821,854,850,870,909,913,931,953,969,1001,1032,1057,1125],

'Alex':[55,121,169,194,245,322,344,395,443,507,543,585,611,641,688,746,795,847,893,949,1016,1057,1134,1173,1230,1273,1338,1395,1448,1511,1546,1602,1626,1660]

}

const players=Object.keys(playerPoints)

const colors=[
'#E41A1C',
'#377EB8',
'#4DAF4A',
'#984EA3',
'#FF7F00',
'#A65628',
'#F781BF',
'#999999',
'#66C2A5',
'#FFD92F',
'#000000'
]

const selectedPlayers=new Set()

const datasets=players.map((name,index)=>({

label:name,

data:playerPoints[name],

borderColor:colors[index],

backgroundColor:colors[index],

fill:false,

pointBackgroundColor:colors[index],

pointBorderColor:colors[index],

pointBorderWidth:0,

borderWidth:2,

pointRadius:4,

pointHoverRadius:6

}))


const ctx=document
.getElementById('fieberkurveChart')
.getContext('2d')


const chart=new Chart(ctx,{

type:'line',

data:{

labels:Array.from(
{length:34},
(_,i)=>i+1
),

datasets:datasets

},

options:{

responsive:true,

maintainAspectRatio:false,

interaction:{
mode:'index',
intersect:false
},

plugins:{

legend:{

position:'top',

labels:{
usePointStyle:true
},

onClick:(e,legendItem)=>{

const clicked=legendItem.text

if(selectedPlayers.has(clicked)){
selectedPlayers.delete(clicked)
}else{
selectedPlayers.add(clicked)
}

chart.data.datasets.forEach(dataset=>{

const idx=players.indexOf(dataset.label)

if(
selectedPlayers.size===0 ||
selectedPlayers.has(dataset.label)
){

const color=colors[idx]

dataset.borderColor=color
dataset.backgroundColor=color
dataset.pointBackgroundColor=color
dataset.pointBorderColor=color

dataset.borderWidth=
selectedPlayers.has(dataset.label)
?3
:2

dataset.pointRadius=
selectedPlayers.has(dataset.label)
?6
:4

dataset.pointHoverRadius=
selectedPlayers.has(dataset.label)
?7
:5

}else{

const grey='lightgrey'

dataset.borderColor=grey
dataset.backgroundColor=grey
dataset.pointBackgroundColor=grey
dataset.pointBorderColor=grey

dataset.borderWidth=1
dataset.pointRadius=3
dataset.pointHoverRadius=4

}

})

chart.update()

}

}

},

scales:{

x:{

title:{
display:true,
text:'Spieltag'
}

},

y:{

title:{
display:true,
text:'Punkte'
},

beginAtZero:true

}

}

}

})


function segmentPoints(arr,start,end){

return arr[end-1] -
(start>1 ? arr[start-2] : 0)

}


function updateChart(){

const start=
parseInt(
document.getElementById('startSlider').value
)

const end=
parseInt(
document.getElementById('endSlider').value
)


chart.data.labels=
Array.from(
{length:end-start+1},
(_,i)=>start+i
)


chart.data.datasets.forEach(dataset=>{

const original=
playerPoints[dataset.label]

dataset.data=
original.slice(start-1,end)

})


chart.options.scales.y.title.text=
'Gesamtpunkte'

chart.update()

}


function createTable(
title,
matchLabel,
dataArray
){

const wrapper=
document.createElement('div')

wrapper.className='table-block'

const titleDiv=
document.createElement('div')

titleDiv.className='table-title'

titleDiv.textContent=title


const table=
document.createElement('table')


let html=
'<tr>' +
'<th>Rang</th>' +
'<th>Spieler</th>' +
'<th>'+matchLabel+'</th>' +
'</tr>'


dataArray.forEach((d,i)=>{

html+='<tr>'

html+='<td>'+(i+1)+'</td>'

html+='<td>'+d.name+'</td>'

html+='<td>'+d.points+'</td>'

html+='</tr>'

})


table.innerHTML=html

wrapper.appendChild(titleDiv)

wrapper.appendChild(table)

return wrapper

}


function updateTable(){

const start=
parseInt(
document.getElementById('startSlider').value
)

const end=
parseInt(
document.getElementById('endSlider').value
)


const standings=players.map(player=>({

name:player,

points:
segmentPoints(
playerPoints[player],
start,
end
)

}))


standings.sort(
(a,b)=>b.points-a.points
)


container.innerHTML=''


container.appendChild(

createTable(
'Formtabelle',
'Spieltag '+start+' bis '+end,
standings
)

)

}


function updateEverything(){

const startSlider=
document.getElementById('startSlider')

const endSlider=
document.getElementById('endSlider')


let start=
parseInt(startSlider.value)

let end=
parseInt(endSlider.value)


if(start>end){

if(document.activeElement===startSlider){

end=start
endSlider.value=end

}else{

start=end
startSlider.value=start

}

}


document.getElementById('startValue').textContent=start

document.getElementById('endValue').textContent=end

document.getElementById('rangeDisplay').textContent=
'Spieltag '+start+' bis '+end


updateChart()

updateTable()

}


const startSlider=
document.getElementById('startSlider')

const endSlider=
document.getElementById('endSlider')


startSlider.addEventListener(
'input',
updateEverything
)


endSlider.addEventListener(
'input',
updateEverything
)


updateEverything()

</script>

</body>
</html>
