<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season 26-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box}
body{font-family:'Inter','Segoe UI',Roboto,sans-serif;margin:0;padding:0;background:linear-gradient(135deg,#e9eff5,#f9fafc);color:#222;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin:28px 0 4px;font-size:1.9rem;font-weight:700;background:linear-gradient(90deg,#0056b3,#0091ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.hint{font-size:.78rem;color:#888;margin:0 0 20px;text-align:center;letter-spacing:.01em}
.section-label{width:90%;max-width:1200px;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#aaa;padding:0 4px 6px;border-bottom:1px solid #dde3ea;margin-bottom:0;margin-top:28px}
.section-label:first-of-type{margin-top:4px}
.chart-container{width:90%;max-width:1200px;background:white;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);padding:20px 20px 16px;margin-bottom:24px;aspect-ratio:2.4/1;min-height:280px;max-height:520px;position:relative}
.chart-container.interactive{padding-bottom:8px;margin-bottom:10px}
.chart-container.interactive .chart-inner{height:100%;position:relative}
.chart-container.interactive canvas{width:100%!important;height:100%!important}
.tooltip-custom{position:fixed;z-index:1000;pointer-events:none;background:white;color:#222;border:1px solid #dde3ea;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);padding:9px 11px;font-size:.78rem;line-height:1.5;white-space:nowrap;opacity:0;transition:opacity .08s ease}
.tooltip-custom.visible{opacity:1}
.tooltip-title{font-weight:700;color:#555;margin-bottom:3px}
.tooltip-row{display:flex;align-items:center;gap:6px}
.tooltip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.interactive-controls{width:90%;max-width:1200px;background:white;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);padding:12px 16px 10px;margin-bottom:20px}
.controls-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.range-label{font-size:.82rem;color:#666}
.range-label strong{color:#222}
.reset-btn{border:1px solid #d7dce2;background:white;color:#555;border-radius:6px;padding:5px 10px;font-size:.75rem;cursor:pointer}
.reset-btn:hover{background:#f4f6f9}
.range-slider{position:relative;height:24px}
.slider-track,.slider-range{position:absolute;top:10px;height:4px;border-radius:4px}
.slider-track{left:0;right:0;background:#e0e4e8}
.slider-range{background:#0077d9}
.range-slider input{position:absolute;left:0;top:0;width:100%;height:24px;margin:0;background:none;pointer-events:none;appearance:none}
.range-slider input::-webkit-slider-thumb{appearance:none;width:17px;height:17px;border-radius:50%;background:#0077d9;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;pointer-events:auto}
.range-slider input::-moz-range-thumb{width:17px;height:17px;border:2px solid white;border-radius:50%;background:#0077d9;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;pointer-events:auto}
.slider-ticks{display:flex;justify-content:space-between;font-size:.65rem;color:#999;margin-top:1px}
.range-table-wrapper{width:90%;max-width:1200px;margin:0 0 28px}
.range-table-title{text-align:center;font-weight:700;font-size:1rem;margin:0 0 9px}
.tables-wrapper{display:flex;width:90%;max-width:1200px;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:48px;margin-top:12px}
.table-block{width:47%}
.table-title{text-align:center;font-weight:700;margin-bottom:10px;font-size:1.05rem}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04)}
thead tr{background:#f4f6f9}
th{padding:9px 10px;text-align:center;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#777;border-bottom:1px solid #e8ecf0}
td{padding:8px 10px;text-align:center;border-bottom:1px solid #f0f2f5;font-size:.875rem}
tbody tr:nth-child(even) td{background:#fafbfc}
tbody tr:last-child td{border-bottom:none}
tbody tr.rank-1 td{background:#fffbea!important}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:.75rem;font-weight:700;background:#eef0f3;color:#555}
.rank-badge.gold{background:linear-gradient(135deg,#f6d365,#fda085);color:white}
.player-cell{display:flex;align-items:center;gap:7px;justify-content:flex-start;padding-left:4px}
.player-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.diff-pos{color:#1a8a1a;font-weight:700}
.diff-neg{color:#cc1a1a;font-weight:700}
.diff-zero{color:#888;font-weight:700}
@media(max-width:640px){
h1{font-size:1.35rem;margin:18px 0 4px}
.hint{font-size:.72rem}
.section-label{font-size:.65rem;margin-top:20px}
.chart-container{width:96%;aspect-ratio:unset;height:52vw;min-height:200px;max-height:300px;padding:12px 10px 10px;margin-bottom:16px;border-radius:10px}
.chart-container.interactive{padding-bottom:6px}
.interactive-controls{width:96%;padding:10px 11px 8px;margin-bottom:16px}
.range-label{font-size:.75rem}
.reset-btn{font-size:.7rem;padding:4px 8px}
.range-table-wrapper{width:96%}
.tables-wrapper{width:96%;flex-direction:column;gap:14px}
.table-block{width:100%}
.table-title{font-size:.9rem}
th{font-size:.62rem;padding:7px 6px}
td{font-size:.8rem;padding:6px 6px}
.player-dot{width:8px;height:8px}
.rank-badge{width:19px;height:19px;font-size:.68rem}
.tooltip-custom{font-size:.7rem;padding:7px 8px}
}
</style>
</head>

<body>

<h1>Kicker Interactive Manager Season 26-27</h1>

<script>
const playerPoints={
'Markus':[83,193,291,380],
'Erwin':[58,86,124,154],
'Phil':[59,77,116,186],
'Didi':[68,141,212,272],
'Steffo':[59,106,177,250],
'Basti':[62,93,131,194],
'Eirik':[69,75,108,170],
'Emil':[51,75,75,145],
'Kempka':[49,84,129,170],
'Espen':[64,124,213,285],
'Alex':[42,90,141,184]
};

const players=Object.keys(playerPoints);

const colors=[
'#E41A1C','#377EB8','#4DAF4A','#984EA3','#FF7F00',
'#A65628','#F781BF','#999999','#66C2A5','#FFD92F','#000000'
];

const colorMap=Object.fromEntries(players.map((p,i)=>[p,colors[i]]));

const TOTAL_MDS=34;
const labels=Array.from({length:TOTAL_MDS},(_,i)=>i+1);
const played=Math.max(...players.map(p=>playerPoints[p].length));

function mdPoints(arr){
return Array.from({length:TOTAL_MDS},(_,i)=>i<arr.length?(i?arr[i]-arr[i-1]:arr[0]):null);
}

function cumulativeForChart(arr){
return Array.from({length:TOTAL_MDS},(_,i)=>i<arr.length?arr[i]:null);
}

function leaguePos(data){
const out={};
players.forEach(p=>out[p]=[]);
for(let i=0;i<TOTAL_MDS;i++){
if(i>=played){players.forEach(p=>out[p].push(null));continue}
const ranked=players.filter(p=>i<data[p].length).map(p=>({p,pts:data[p][i]})).sort((a,b)=>b.pts-a.pts);
ranked.forEach((x,r)=>out[x.p].push(r+1));
players.filter(p=>i>=data[p].length).forEach(p=>out[p].push(null));
}
return out;
}

function mdRank(data){
const out={};
players.forEach(p=>out[p]=[]);
for(let i=0;i<TOTAL_MDS;i++){
if(i>=played){players.forEach(p=>out[p].push(null));continue}
const ranked=players.filter(p=>i<data[p].length).map(p=>({p,pts:i?data[p][i]-data[p][i-1]:data[p][0]})).sort((a,b)=>b.pts-a.pts);
ranked.forEach((x,r)=>out[x.p].push(r+1));
players.filter(p=>i>=data[p].length).forEach(p=>out[p].push(null));
}
return out;
}

const cumulative=Object.fromEntries(players.map(p=>[p,cumulativeForChart(playerPoints[p])]));
const md=Object.fromEntries(players.map(p=>[p,mdPoints(playerPoints[p])]));
const league=leaguePos(playerPoints);
const rank=mdRank(playerPoints);

const avgMd=Array.from({length:TOTAL_MDS},(_,i)=>{
if(i>=played)return null;
const vals=players.map(p=>md[p][i]).filter(v=>v!==null&&v!==undefined);
return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:null;
});

const hinEnd=Math.min(17,played);
const rueckStart=17;
const rueckEnd=played-1;

function segmentPts(arr,startIdx,endIdx){
if(startIdx>arr.length-1)return 0;
const end=Math.min(endIdx,arr.length-1);
return arr[end]-(startIdx>0?arr[startIdx-1]:0);
}

const rueckPlayed=Math.max(0,played-hinEnd);
const hinPtsMap={},rueckPtsMap={},hinEquivPtsMap={};

players.forEach(p=>{
hinPtsMap[p]=segmentPts(playerPoints[p],0,hinEnd-1);
rueckPtsMap[p]=segmentPts(playerPoints[p],rueckStart,rueckEnd);
hinEquivPtsMap[p]=segmentPts(playerPoints[p],0,rueckPlayed-1);
});

const hin=players.map(p=>({name:p,pts:hinPtsMap[p]})).sort((a,b)=>b.pts-a.pts);
const rueck=players.map(p=>({name:p,pts:rueckPtsMap[p],diff:rueckPtsMap[p]-hinEquivPtsMap[p]})).sort((a,b)=>b.pts-a.pts);

const selectedPlayers=new Set();
const allCharts=[];

function isMobile(){
return window.innerWidth<=640;
}

function applyFade(){
allCharts.forEach(chart=>{
chart.data.datasets.forEach(dataset=>{
const idx=players.indexOf(dataset.label);
if(idx===-1)return;
const selected=selectedPlayers.has(dataset.label);
const none=selectedPlayers.size===0;
const col=colors[idx];
if(none||selected){
dataset.borderColor=col;
dataset.backgroundColor=col;
dataset.pointBackgroundColor=col;
dataset.pointBorderColor=col;
dataset.borderWidth=selected?3:2;
dataset.pointRadius=selected?6:4;
dataset.pointHoverRadius=selected?7:5;
}else{
dataset.borderColor='lightgrey';
dataset.backgroundColor='lightgrey';
dataset.pointBackgroundColor='lightgrey';
dataset.pointBorderColor='lightgrey';
dataset.borderWidth=1;
dataset.pointRadius=3;
dataset.pointHoverRadius=4;
}
});
chart.update();
});
}

function legendClickHandler(e,item){
const p=item.text;
selectedPlayers.has(p)?selectedPlayers.delete(p):selectedPlayers.add(p);
applyFade();
}

Chart.Tooltip.positioners.side=function(elements){
const chart=this.chart;
if(!elements.length)return false;
const x=elements[0].element.x;
const area=chart.chartArea;
const spacing=(area.right-area.left)/(chart.data.labels.length-1);
const offset=spacing*2+12;
const mdIndex=elements[0].index;
const left=mdIndex>=17;
const tw=this.width||160;
return{x:left?x-offset-tw:x+offset,y:(area.top+area.bottom)/2};
};

function makeChart(id,title,data,reverseY=false,extraDatasets=[]){
const mobile=isMobile();
const chart=new Chart(document.getElementById(id),{
type:'line',
data:{
labels,
datasets:[
...players.map((p,i)=>({
label:p,
data:data[p],
borderColor:colors[i],
backgroundColor:colors[i],
pointBackgroundColor:colors[i],
pointBorderColor:colors[i],
pointBorderWidth:0,
pointStyle:'circle',
pointRadius:mobile?2:4,
pointHoverRadius:mobile?4:6,
borderWidth:mobile?1.5:2,
spanGaps:false,
order:0
})),
...extraDatasets
]},
options:{
responsive:true,
maintainAspectRatio:false,
interaction:{mode:'index',intersect:false},
plugins:{
legend:{
position:'bottom',
labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,boxHeight:8,padding:mobile?8:14,font:{size:mobile?10:12}},
onClick:legendClickHandler
},
title:{
display:true,
text:title,
font:{size:mobile?14:20,weight:'bold'},
padding:{top:4,bottom:14},
color:'#111'
},
tooltip:{
backgroundColor:'white',
borderColor:'#dde3ea',
borderWidth:1,
titleColor:'#555',
bodyColor:'#222',
padding:10,
boxWidth:10,
boxHeight:10,
usePointStyle:true,
position:'side',
xAlign:'left',
yAlign:'center',
caretSize:0,
caretPadding:8,
callbacks:{
labelColor:function(context){
const idx=players.indexOf(context.dataset.label);
const col=idx===-1?'#bbbbbb':colors[idx];
return{borderColor:col,backgroundColor:col,borderWidth:2};
}
}
}
},
scales:{
x:{
title:{display:!mobile,text:'Spieltag'},
ticks:{maxTicksLimit:mobile?10:34,font:{size:mobile?9:11}},
grid:{color:'#f0f2f5'}
},
y:{
beginAtZero:false,
reverse:reverseY,
ticks:{font:{size:mobile?9:11}},
grid:{color:'#f0f2f5'}
}
}
}
});
allCharts.push(chart);
return chart;
}

function addSection(text){
const el=document.createElement('div');
el.className='section-label';
el.textContent=text;
document.body.appendChild(el);
}

function addChartContainer(id,interactive=false){
const div=document.createElement('div');
div.className='chart-container'+(interactive?' interactive':'');
if(interactive){
const inner=document.createElement('div');
inner.className='chart-inner';
const canvas=document.createElement('canvas');
canvas.id=id;
inner.appendChild(canvas);
div.appendChild(inner);
}else{
const canvas=document.createElement('canvas');
canvas.id=id;
div.appendChild(canvas);
}
document.body.appendChild(div);
}

addSection('');
addChartContainer('c1',true);

const controls=document.createElement('div');
controls.className='interactive-controls';
controls.innerHTML=`
<div class="controls-top">
<div class="range-label">Spieltage: <strong id="rangeMinLabel">1</strong> – <strong id="rangeMaxLabel">${played}</strong></div>
<button class="reset-btn" id="resetRange">Reset</button>
</div>
<div class="range-slider">
<div class="slider-track"></div>
<div class="slider-range" id="sliderRange"></div>
<input id="rangeMin" type="range" min="1" max="${played}" value="1">
<input id="rangeMax" type="range" min="1" max="${played}" value="${played}">
</div>
<div class="slider-ticks"><span>1</span><span>${played}</span></div>`;
document.body.appendChild(controls);

const rangeTable=document.createElement('div');
rangeTable.className='range-table-wrapper';
document.body.appendChild(rangeTable);

addSection('');
addChartContainer('c2');

addSection('');
addChartContainer('c3');

addSection('');
addChartContainer('c4');

const mobileNow=isMobile();

const avgDataset={
label:'Ø Punkte',
data:avgMd,
borderColor:'#bbbbbb',
backgroundColor:'rgba(160,160,160,0.18)',
pointBackgroundColor:'#bbbbbb',
pointBorderColor:'#bbbbbb',
pointBorderWidth:0,
pointStyle:'circle',
pointRadius:mobileNow?2:4,
pointHoverRadius:mobileNow?4:6,
borderWidth:mobileNow?1.5:2,
borderDash:[6,4],
spanGaps:false,
fill:'origin',
order:1
};

let c1;

function buildC1Data(start,end){
return Object.fromEntries(players.map(p=>[
p,
Array.from({length:end-start+1},(_,i)=>playerPoints[p][start+i-1]??null)
]));
}

function createC1(start=1,end=played){
if(c1){
const data=buildC1Data(start,end);
c1.data.labels=Array.from({length:end-start+1},(_,i)=>start+i);
c1.data.datasets.forEach(ds=>{
if(players.includes(ds.label))ds.data=data[ds.label];
});
c1.options.scales.x.ticks.callback=(value,index)=>start+index;
c1.update();
return;
}

const data=buildC1Data(start,end);

c1=new Chart(document.getElementById('c1'),{
type:'line',
data:{
labels:Array.from({length:end-start+1},(_,i)=>start+i),
datasets:players.map((p,i)=>({
label:p,
data:data[p],
borderColor:colors[i],
backgroundColor:colors[i],
pointBackgroundColor:colors[i],
pointBorderColor:colors[i],
pointBorderWidth:0,
pointStyle:'circle',
pointRadius:isMobile()?2:4,
pointHoverRadius:isMobile()?4:6,
borderWidth:isMobile()?1.5:2,
spanGaps:false,
order:0
}))
},
options:{
responsive:true,
maintainAspectRatio:false,
interaction:{mode:'index',intersect:false},
plugins:{
legend:{
position:'bottom',
labels:{
usePointStyle:true,
pointStyle:'circle',
boxWidth:8,
boxHeight:8,
padding:isMobile()?8:14,
font:{size:isMobile()?10:12}
},
onClick:legendClickHandler
},
title:{
display:true,
text:'Saisonpunkte 26-27',
font:{size:isMobile()?14:20,weight:'bold'},
padding:{top:4,bottom:14},
color:'#111'
},
tooltip:{
enabled:false,
external:function(context){
const tooltipModel=context.tooltip;
if(!tooltipModel||tooltipModel.opacity===0){
hideInteractiveTooltip();
return;
}

const index=tooltipModel.dataPoints?.[0]?.dataIndex;
if(index===undefined)return;

const mdNumber=start+index;
const values=players
.map((p,i)=>({name:p,value:playerPoints[p][mdNumber-1],color:colors[i]}))
.filter(x=>x.value!==undefined)
.sort((a,b)=>b.value-a.value);

let html=`<div class="tooltip-title">Spieltag ${mdNumber}</div>`;
html+=values.map(x=>`
<div class="tooltip-row">
<span class="tooltip-dot" style="background:${x.color}"></span>
<span>${x.name}: ${x.value}</span>
</div>`).join('');

showInteractiveTooltip(html,mdNumber,tooltipModel.chart,tooltipModel);
}
}
},
scales:{
x:{
title:{display:!isMobile(),text:'Spieltag'},
ticks:{maxTicksLimit:isMobile()?10:34,font:{size:isMobile()?9:11}},
grid:{color:'#f0f2f5'}
},
y:{
beginAtZero:false,
ticks:{font:{size:isMobile()?9:11}},
grid:{color:'#f0f2f5'}
}
}
}
});

allCharts.push(c1);
}

let interactiveTooltip=document.createElement('div');
interactiveTooltip.className='tooltip-custom';
document.body.appendChild(interactiveTooltip);

function showInteractiveTooltip(html,mdNumber,chart,model){
interactiveTooltip.innerHTML=html;
interactiveTooltip.classList.add('visible');

const canvas=chart.canvas;
const rect=canvas.getBoundingClientRect();
const x=rect.left+model.caretX;
const y=rect.top+model.caretY;
const tw=interactiveTooltip.offsetWidth;
const th=interactiveTooltip.offsetHeight;
const gap=76;

let left=mdNumber<=17?x+gap:x-gap-tw;
let top=y-th/2;

left=Math.max(4,Math.min(left,window.innerWidth-tw-4));
top=Math.max(4,Math.min(top,window.innerHeight-th-4));

interactiveTooltip.style.left=left+'px';
interactiveTooltip.style.top=top+'px';
}

function hideInteractiveTooltip(){
interactiveTooltip.classList.remove('visible');
}

function updateC1Fade(){
if(!c1)return;

c1.data.datasets.forEach((ds,i)=>{
const selected=selectedPlayers.has(ds.label);
const none=selectedPlayers.size===0;
const col=colors[i];

if(none||selected){
ds.borderColor=col;
ds.backgroundColor=col;
ds.pointBackgroundColor=col;
ds.pointBorderColor=col;
ds.borderWidth=selected?3:2;
ds.pointRadius=selected?6:(isMobile()?2:4);
ds.pointHoverRadius=selected?7:(isMobile()?4:6);
}else{
ds.borderColor='lightgrey';
ds.backgroundColor='lightgrey';
ds.pointBackgroundColor='lightgrey';
ds.pointBorderColor='lightgrey';
ds.borderWidth=1;
ds.pointRadius=3;
ds.pointHoverRadius=4;
}
});
c1.update();
}

function applyFadeOriginal(){
allCharts.forEach(chart=>{
if(chart===c1)return;

chart.data.datasets.forEach(dataset=>{
const idx=players.indexOf(dataset.label);
if(idx===-1)return;

const selected=selectedPlayers.has(dataset.label);
const none=selectedPlayers.size===0;
const col=colors[idx];

if(none||selected){
dataset.borderColor=col;
dataset.backgroundColor=col;
dataset.pointBackgroundColor=col;
dataset.pointBorderColor=col;
dataset.borderWidth=selected?3:2;
dataset.pointRadius=selected?6:4;
dataset.pointHoverRadius=selected?7:5;
}else{
dataset.borderColor='lightgrey';
dataset.backgroundColor='lightgrey';
dataset.pointBackgroundColor='lightgrey';
dataset.pointBorderColor='lightgrey';
dataset.borderWidth=1;
dataset.pointRadius=3;
dataset.pointHoverRadius=4;
}
});
chart.update();
});

updateC1Fade();
}

function applyFade(){
applyFadeOriginal();
}

function updateRangeTable(start,end){
const rows=players
.map((p,i)=>({
name:p,
pts:playerPoints[p][end-1],
gain:playerPoints[p][end-1]-(start>1?playerPoints[p][start-2]:0),
color:colors[i]
}))
.filter(x=>x.pts!==undefined)
.sort((a,b)=>b.pts-a.pts);

rangeTable.innerHTML=`
<div class="range-table-title">Tabelle Spieltag ${start}–${end}</div>
<table>
<thead>
<tr>
<th>Rang</th>
<th>Spieler</th>
<th>Gesamt</th>
<th>Punkte im Bereich</th>
</tr>
</thead>
<tbody>
${rows.map((r,i)=>`
<tr class="${i===0?'rank-1':''}">
<td><span class="${i===0?'rank-badge gold':'rank-badge'}">${i+1}</span></td>
<td>
<div class="player-cell">
<span class="player-dot" style="background:${r.color}"></span>
<span>${r.name}</span>
</div>
</td>
<td>${r.pts}</td>
<td>${r.gain}</td>
</tr>`).join('')}
</tbody>
</table>`;
}

function updateRange(){
let start=+document.getElementById('rangeMin').value;
let end=+document.getElementById('rangeMax').value;

if(start>end){
[start,end]=[end,start];
document.getElementById('rangeMin').value=start;
document.getElementById('rangeMax').value=end;
}

document.getElementById('rangeMinLabel').textContent=start;
document.getElementById('rangeMaxLabel').textContent=end;

document.getElementById('sliderRange').style.left=((start-1)/(played-1)*100)+'%';
document.getElementById('sliderRange').style.right=((played-end)/(played-1)*100)+'%';

createC1(start,end);
updateRangeTable(start,end);
updateC1Fade();
}

document.getElementById('rangeMin').addEventListener('input',updateRange);
document.getElementById('rangeMax').addEventListener('input',updateRange);

document.getElementById('resetRange').onclick=()=>{
document.getElementById('rangeMin').value=1;
document.getElementById('rangeMax').value=played;
updateRange();
};

makeChart('c2','Punkte je Spieltag',md,false,[avgDataset]);
makeChart('c3','Tabellenplatzentwicklung',league,true);
makeChart('c4','Spieltagsplatzierung',rank,true);

createC1();
updateRangeTable(1,played);
updateRange();

const tablesSection=document.createElement('div');
tablesSection.className='section-label';
tablesSection.textContent='Hin- & Rückrunde';
document.body.appendChild(tablesSection);

const tablesWrapper=document.createElement('div');
tablesWrapper.className='tables-wrapper';
document.body.appendChild(tablesWrapper);

function playerNameCell(name){
return`
<div class="player-cell">
<span class="player-dot" style="background:${colorMap[name]}"></span>
<span>${name}</span>
</div>`;
}

function hinTable(title,data){
const w=document.createElement('div');
w.className='table-block';

let html=`
<div class="table-title">${title} <span style="font-size:.72rem;font-weight:400;color:#888">(Spieltag 1–${hinEnd})</span></div>
<table>
<thead>
<tr><th>Rang</th><th>Spieler</th><th>Punkte</th></tr>
</thead>
<tbody>`;

data.forEach((d,i)=>{
const first=i===0;

html+=`
<tr class="${first?'rank-1':''}">
<td><span class="${first?'rank-badge gold':'rank-badge'}">${i+1}</span></td>
<td>${playerNameCell(d.name)}</td>
<td>${d.pts}</td>
</tr>`;
});

html+='</tbody></table>';
w.innerHTML=html;
return w;
}

function rueckTable(title,data){
const w=document.createElement('div');
w.className='table-block';

const rueckLabel=played>hinEnd?`${hinEnd+1}–${played}`:'—';

let html=`
<div class="table-title">${title} <span style="font-size:.72rem;font-weight:400;color:#888">(Spieltag ${rueckLabel})</span></div>
<table>
<thead>
<tr>
<th>Rang</th>
<th>Spieler</th>
<th>Punkte</th>
<th title="Rückrunde MD 1–${rueckPlayed} vs. Hinrunde MD 1–${rueckPlayed}">Diff*</th>
</tr>
</thead>
<tbody>`;

const rueckStarted=played>hinEnd;

data.forEach((d,i)=>{
const first=i===0;
let diffCell;

if(!rueckStarted){
diffCell='<td class="diff-zero">—</td>';
}else{
const diff=d.diff;
let cls,str;

if(diff>0){
cls='diff-pos';
str='+'+diff;
}else if(diff<0){
cls='diff-neg';
str=''+diff;
}else{
cls='diff-zero';
str='±0';
}

diffCell=`<td class="${cls}">${str}</td>`;
}

html+=`
<tr class="${first?'rank-1':''}">
<td><span class="${first?'rank-badge gold':'rank-badge'}">${i+1}</span></td>
<td>${playerNameCell(d.name)}</td>
<td>${d.pts}</td>
${diffCell}
</tr>`;
});

html+='</tbody></table>';

if(rueckStarted){
html+=`<p style="font-size:.7rem;color:#aaa;margin:6px 4px 0;text-align:center">* Rück MD 18–${played} vs. Hin MD 1–${rueckPlayed}</p>`;
}

w.innerHTML=html;
return w;
}

tablesWrapper.appendChild(hinTable('Hinrunde',hin));
tablesWrapper.appendChild(rueckTable('Rückrunde',rueck));

window.addEventListener('resize',()=>{
if(c1){
const start=+document.getElementById('rangeMin').value;
const end=+document.getElementById('rangeMax').value;

c1.data.datasets.forEach((ds,i)=>{
const mobile=isMobile();

ds.pointRadius=selectedPlayers.has(ds.label)?6:(mobile?2:4);
ds.pointHoverRadius=selectedPlayers.has(ds.label)?7:(mobile?4:6);
});

c1.options.scales.x.ticks.maxTicksLimit=isMobile()?10:34;
c1.options.scales.x.title.display=!isMobile();
c1.options.scales.x.ticks.font.size=isMobile()?9:11;
c1.options.scales.y.ticks.font.size=isMobile()?9:11;

c1.update();
updateC1Fade();
}
});
</script>
