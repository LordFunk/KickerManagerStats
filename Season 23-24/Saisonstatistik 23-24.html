<script>

const playerPoints={
    'Markus':[55,128,175,260,343,405,462,518,587,654,708,756,798,892,947,1006,1068,1147,1189,1245,1318,1388,1437,1512,1575,1655,1724,1814,1894,1960,2035,2094,2147,2224],
    'Erwin':[62,144,206,265,305,371,413,473,542,598,646,691,741,782,847,904,972,1037,1067,1131,1186,1252,1300,1380,1413,1490,1558,1621,1656,1705,1756,1797,1820,1845],
    'Phil':[86,170,216,256,306,376,433,478,534,585,604,648,688,715,797,844,906,956,1011,1065,1115,1150,1204,1244,1300,1346,1361,1393,1427,1469,1540,1601,1634,1671],
    'Didi':[70,157,189,216,250,292,313,358,420,469,509,551,593,646,724,790,881,934,965,1006,1043,1087,1135,1172,1252,1323,1372,1415,1483,1532,1592,1643,1647,1667],
    'Steffo':[56,131,205,272,338,376,433,476,550,609,642,665,701,742,823,867,903,948,979,1036,1078,1126,1169,1215,1259,1320,1364,1398,1442,1483,1532,1566,1585,1620],
    'Basti':[53,119,185,213,267,335,399,450,516,553,610,665,726,783,841,870,924,976,1025,1090,1163,1212,1267,1344,1410,1469,1515,1574,1626,1683,1729,1800,1862,1927],
    'Eirik':[69,112,173,221,247,274,300,333,395,429,449,475,493,530,553,585,641,694,705,742,771,807,854,926,976,1052,1083,1124,1185,1220,1253,1302,1351,1421],
    'Emil':[60,173,230,290,332,385,412,441,498,535,595,642,678,725,776,828,906,991,1079,1140,1210,1264,1320,1362,1413,1479,1517,1583,1658,1718,1814,1879,1926,2014],
    'Kempka':[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
    'Espen':[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
    'Alex':[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]
};

const players=Object.keys(playerPoints);

const colors=[
    '#E41A1C',
    '#377EB8',
    '#4DAF4A',
    '#984EA3',
    '#FF7F00',
    '#A65628',
    '#F781BF',
    '#999999',
    '#66C2A5',
    '#FFD92F',
    '#FFFFFF'
];

const colorMap=Object.fromEntries(
    players.map(
        (p,i)=>[p,colors[i]]
    )
);

const TOTAL_MDS=34;

const labels=Array.from(
    {length:TOTAL_MDS},
    (_,i)=>i+1
);

const played=TOTAL_MDS;

function mdPoints(arr){

    return arr.map(
        (value,i)=>
            i===0
            ?
            value
            :
            value-arr[i-1]
    );

}

function leaguePos(data){

    const result={};

    players.forEach(
        p=>result[p]=[]
    );

    for(let i=0;i<played;i++){

        const ranked=
            players
            .filter(
                p=>
                    data[p][i]!==null &&
                    data[p][i]!==undefined
            )
            .sort(
                (a,b)=>
                    data[b][i]-data[a][i]
            );

        ranked.forEach(
            (p,index)=>{
                result[p][i]=index+1;
            }
        );

        players
        .filter(
            p=>
                data[p][i]===null ||
                data[p][i]===undefined
        )
        .forEach(
            p=>{
                result[p][i]=null;
            }
        );

    }

    return result;

}

function mdRank(data){

    const result={};

    players.forEach(
        p=>result[p]=[]
    );

    for(let i=0;i<played;i++){

        const ranked=
            players
            .filter(
                p=>
                    mdPoints(data[p])[i]!==null &&
                    mdPoints(data[p])[i]!==undefined
            )
            .sort(
                (a,b)=>
                    mdPoints(data[b])[i]-
                    mdPoints(data[a])[i]
            );

        ranked.forEach(
            (p,index)=>{
                result[p][i]=index+1;
            }
        );

        players
        .filter(
            p=>
                data[p][i]===null ||
                data[p][i]===undefined
        )
        .forEach(
            p=>{
                result[p][i]=null;
            }
        );

    }

    return result;

}

const md=
    Object.fromEntries(
        players.map(
            p=>[
                p,
                mdPoints(playerPoints[p])
            ]
        )
    );

const league=
    leaguePos(playerPoints);

const rank=
    mdRank(playerPoints);

const selectedPlayers=
    new Set();

const allCharts=[];

function isMobile(){

    return window.innerWidth<=700;

}

function legendClickHandler(
    event,
    item
){

    const player=item.text;

    if(selectedPlayers.has(player)){

        selectedPlayers.delete(player);

    }else{

        selectedPlayers.add(player);

    }

    applyFade();

}

function applyFade(){

    allCharts.forEach(
        chart=>{

            chart.data.datasets.forEach(
                (dataset,i)=>{

                    if(!players.includes(dataset.label))
                        return;

                    const selected=
                        selectedPlayers.has(
                            dataset.label
                        );

                    const none=
                        selectedPlayers.size===0;

                    const color=
                        colors[
                            players.indexOf(
                                dataset.label
                            )
                        ];

                    if(none||selected){

                        dataset.borderColor=color;
                        dataset.backgroundColor=color;
                        dataset.pointBackgroundColor=color;
                        dataset.pointBorderColor=color;
                        dataset.borderWidth=
                            selected
                            ?
                            3
                            :
                            2;

                    }else{

                        dataset.borderColor='#333';
                        dataset.backgroundColor='#333';
                        dataset.pointBackgroundColor='#333';
                        dataset.pointBorderColor='#333';
                        dataset.borderWidth=1;

                    }

                }
            );

            chart.update();

        }
    );

}

function makeChart(
    id,
    title,
    data,
    reverseY=false
){

    const chart=
        new Chart(
            document.getElementById(id),
            {

                type:'line',

                data:{

                    labels,

                    datasets:
                        players.map(
                            (p,i)=>({

                                label:p,

                                data:data[p],

                                borderColor:colors[i],

                                backgroundColor:colors[i],

                                pointBackgroundColor:colors[i],

                                pointBorderColor:colors[i],

                                pointStyle:'circle',

                                pointRadius:
                                    isMobile()
                                    ?
                                    2
                                    :
                                    4,

                                pointHoverRadius:
                                    isMobile()
                                    ?
                                    4
                                    :
                                    6,

                                borderWidth:
                                    isMobile()
                                    ?
                                    1.5
                                    :
                                    2,

                                spanGaps:false

                            })
                        )

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{
                        mode:'index',
                        intersect:false
                    },

                    plugins:{

                        legend:{

                            position:'bottom',

                            labels:{

                                usePointStyle:true,

                                pointStyle:'circle',

                                boxWidth:8,

                                boxHeight:8,

                                padding:
                                    isMobile()
                                    ?
                                    8
                                    :
                                    14,

                                color:'#888',

                                font:{
                                    size:
                                        isMobile()
                                        ?
                                        10
                                        :
                                        12
                                }

                            },

                            onClick:
                                legendClickHandler

                        },

                        title:{

                            display:true,

                            text:title,

                            color:'#f5f5f5',

                            font:{

                                    isMobile()
                                    ?
                                    14
                                    :
                                    20,

                            },

                            padding:{
                                top:4,
                                bottom:14
                            }

                        },

                        tooltip:{

                            backgroundColor:'#111',

                                'rgba(255,255,255,.12)',

                        }

                    },

                    scales:{

                                maxTicksLimit:
                                    isMobile()

                                    34

                            grid:{
                                color:'rgba(255,255,255,.06)'

                        },

                        y:{

                            reverse:reverseY,

                            ticks:{
                                color:'#777'

                            grid:{

let interactiveTooltip=
    document.createElement('div');

interactiveTooltip.className=
    'tooltip-custom';

document.body.appendChild(
    interactiveTooltip
);

function showInteractiveTooltip(
    html,
    mdNumber,
    chart,
    model
){

    interactiveTooltip.innerHTML=html;

    interactiveTooltip.classList.add(
        'visible'
    );

    const rect=
        chart.canvas.getBoundingClientRect();

    const x=
        rect.left+
        model.caretX;

    const y=
        rect.top+
        model.caretY;

    const width=
        interactiveTooltip.offsetWidth;

    const height=
        interactiveTooltip.offsetHeight;

    const gap=76;

    let left=
        mdNumber<=17
        ?
        x+gap
        :
        x-gap-width;

    let top=
        y-height/2;

    left=
        Math.max(
            4,
            Math.min(
                left,
                window.innerWidth-width-4
            )
        );

    top=
        Math.max(
            4,
            Math.min(
                top,
                window.innerHeight-height-4
            )
        );

    interactiveTooltip.style.left=
        left+'px';

    interactiveTooltip.style.top=
        top+'px';

}

function hideInteractiveTooltip(){

    interactiveTooltip.classList.remove(
        'visible'
    );

}

let c1;

function createC1(
    start=1,
    end=TOTAL_MDS
){

    const c1Labels=
        Array.from(
            {
                length:end-start+1
            },
            (_,i)=>start+i
        );

    const datasets=
        players.map(
            (p,i)=>({

                label:p,

                data:
                    c1Labels.map(
                        mdNumber=>
                            playerPoints[p][mdNumber-1]
                            ??
                            null
                    ),

                borderColor:colors[i],

                backgroundColor:colors[i],

                pointBackgroundColor:colors[i],

                pointBorderColor:colors[i],

                pointStyle:'circle',

                pointRadius:
                    isMobile()
                    ?
                    2
                    :
                    4,

                pointHoverRadius:
                    isMobile()
                    ?
                    4
                    :
                    6,

                borderWidth:
                    isMobile()
                    ?
                    1.5
                    :
                    2,

                spanGaps:false

            })
        );

    if(c1){

        c1.data.labels=c1Labels;

        c1.data.datasets.forEach(
            dataset=>{

                const index=
                    players.indexOf(
                        dataset.label
                    );

                if(index!==-1){

                    dataset.data=
                        datasets[index].data;

                }

            }
        );

        c1.update();

        return;

    }

    c1=
        new Chart(
            document.getElementById('c1'),
            {

                type:'line',

                data:{

                    labels:c1Labels,

                    datasets

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:false,

                    interaction:{
                        mode:'index',
                        intersect:false
                    },

                    layout:{
                        padding:{
                            top:5,
                            right:8,
                            bottom:12,
                            left:8
                        }
                    },

                    plugins:{

                        legend:{

                            position:'bottom',

                            labels:{

                                usePointStyle:true,

                                pointStyle:'circle',

                                boxWidth:8,

                                boxHeight:8,

                                padding:
                                    isMobile()
                                    ?
                                    8
                                    :
                                    14,

                                color:'#888',

                                font:{
                                    size:
                                        isMobile()
                                        ?
                                        10
                                        :
                                        12
                                }

                            },

                            onClick:
                                legendClickHandler

                        },

                        title:{

                            display:true,

                            text:'Saisonpunkte 23-24',

                            color:'#f5f5f5',

                            font:{
                                size:
                                    isMobile()
                                    ?
                                    14
                                    :
                                    20,
                                weight:'bold'
                            },

                            padding:{
                                top:4,
                                bottom:14
                            }

                        },

                        tooltip:{

                            enabled:false,

                            external:function(context){

                                const tooltip=
                                    context.tooltip;

                                if(
                                    !tooltip ||
                                    tooltip.opacity===0
                                ){

                                    hideInteractiveTooltip();

                                    return;

                                }

                                if(
                                    !tooltip.dataPoints ||
                                    !tooltip.dataPoints.length
                                ){

                                    hideInteractiveTooltip();

                                    return;

                                }

                                const index=
                                    tooltip.dataPoints[0].dataIndex;

                                const mdNumber=
                                    c1Labels[index];

                                if(!mdNumber){

                                    hideInteractiveTooltip();

                                    return;

                                }

                                const values=
                                    players
                                    .map(
                                        (p,i)=>({

                                            name:p,

                                            value:
                                                playerPoints[p][mdNumber-1],

                                            color:colors[i]

                                        })
                                    )
                                    .filter(
                                        item=>
                                            item.value!==null &&
                                            item.value!==undefined
                                    )
                                    .sort(
                                        (a,b)=>
                                            b.value-a.value
                                    );

                                let html=
                                    '<div class="tooltip-title">Spieltag '
                                    +
                                    mdNumber
                                    +
                                    '</div>';

                                values.forEach(
                                    item=>{

                                        html+=
                                            '<div class="tooltip-row">'
                                            +
                                            '<span class="tooltip-dot" style="background:'
                                            +
                                            item.color
                                            +
                                            '"></span>'
                                            +
                                            '<span>'
                                            +
                                            item.name
                                            +
                                            ': '
                                            +
                                            item.value
                                            +
                                            '</span>'
                                            +
                                            '</div>';

                                    }
                                );

                                showInteractiveTooltip(
                                    html,
                                    mdNumber,
                                    tooltip.chart,
                                    tooltip
                                );

                            }

                        }

                    },

                    scales:{

                        x:{

                            title:{
                                display:true,
                                text:'Spieltag',
                                color:'#777'
                            },

                            ticks:{

                                color:'#777',

                                autoSkip:false,

                                maxTicksLimit:
                                    isMobile()
                                    ?
                                    10
                                    :
                                    34

                            },

                            grid:{
                                color:'rgba(255,255,255,.06)'
                            }

                        },

                        y:{

                            beginAtZero:false,

                            ticks:{
                                color:'#777'
                            },

                            grid:{
                                color:'rgba(255,255,255,.06)'
                            }

                        }

                    }

                }

            }
        );

    allCharts.push(c1);

}

function updateC1Fade(){

    if(!c1)
        return;

    c1.data.datasets.forEach(
        (dataset,i)=>{

            const selected=
                selectedPlayers.has(
                    dataset.label
                );

            const none=
                selectedPlayers.size===0;

            if(none||selected){

                dataset.borderColor=
                    colors[i];

                dataset.backgroundColor=
                    colors[i];

                dataset.pointBackgroundColor=
                    colors[i];

                dataset.pointBorderColor=
                    colors[i];

                dataset.borderWidth=
                    selected
                    ?
                    3
                    :
                    2;

            }else{

                dataset.borderColor='#333';
                dataset.backgroundColor='#333';
                dataset.pointBackgroundColor='#333';
                dataset.pointBorderColor='#333';
                dataset.borderWidth=1;

            }

        }
    );

    c1.update();

}

function updateRangeTable(
    start,
    end
){

    const rows=
        players
        .map(
            (p,i)=>({

                name:p,

                total:
                    playerPoints[p][end-1],

                range:
                    playerPoints[p][end-1]
                    -
                    (
                        start>1
                        ?
                        playerPoints[p][start-2]
                        :
                        0
                    ),

                color:colors[i]

            })
        )
        .filter(
            row=>
                row.total!==null &&
                row.total!==undefined
        )
        .sort(
            (a,b)=>
                b.total-a.total
        );

    let html=
        '<div class="range-table-title">'
        +
        'Tabelle Spieltag '
        +
        start
        +
        '–'
        +
        end
        +
        '</div>';

    html+=
        '<table>'
        +
        '<thead>'
        +
        '<tr>'
        +
        '<th>Rang</th>'
        +
        '<th>Spieler</th>'
        +
        '<th>Gesamt</th>'
        +
        '<th>Punkte im Bereich</th>'
        +
        '</tr>'
        +
        '</thead>'
        +
        '<tbody>';

    rows.forEach(
        (row,index)=>{

            html+=
                '<tr class="'
                +
                (
                    index===0
                    ?
                    'rank-1'
                    :
                    ''
                )
                +
                '">';

            html+=
                '<td>'
                +
                '<span class="'
                +
                (
                    index===0
                    ?
                    'rank-badge gold'
                    :
                    'rank-badge'
                )
                +
                '">'
                +
                (index+1)
                +
                '</span>'
                +
                '</td>';

            html+=
                '<td>'
                +
                '<div class="player-cell">'
                +
                '<span class="player-dot" style="background:'
                +
                row.color
                +
                '"></span>'
                +
                '<span>'
                +
                row.name
                +
                '</span>'
                +
                '</div>'
                +
                '</td>';

            html+=
                '<td>'
                +
                row.total
                +
                '</td>';

            html+=
                '<td>'
                +
                row.range
                +
                '</td>';

            html+=
                '</tr>';

        }
    );

    html+=
        '</tbody>'
        +
        '</table>';

    document.getElementById(
        'rangeTable'
    ).innerHTML=html;

}

function updateRange(){

    let start=
        Number(
            document.getElementById(
                'rangeMin'
            ).value
        );

    let end=
        Number(
            document.getElementById(
                'rangeMax'
            ).value
        );

    if(start>end){

        if(
            document.activeElement &&
            document.activeElement.id==='rangeMin'
        ){

            start=end;

            document.getElementById(
                'rangeMin'
            ).value=start;

        }else{

            end=start;

            document.getElementById(
                'rangeMax'
            ).value=end;

        }

    }

    document.getElementById(
        'rangeMinLabel'
    ).textContent=start;

    document.getElementById(
        'rangeMaxLabel'
    ).textContent=end;

    const denominator=
        TOTAL_MDS-1;

    document.getElementById(
        'sliderRange'
    ).style.left=
        (
            (start-1)
            /
            denominator
            *
            100
        )
        +
        '%';

    document.getElementById(
        'sliderRange'
    ).style.right=
        (
            (TOTAL_MDS-end)
            /
            denominator
            *
            100
        )
        +
        '%';

    createC1(
        start,
        end
    );

    updateRangeTable(
        start,
        end
    );

    updateC1Fade();

}

document.getElementById(
    'rangeMin'
).addEventListener(
    'input',
    updateRange
);

document.getElementById(
    'rangeMax'
).addEventListener(
    'input',
    updateRange
);

document.getElementById(
    'resetRange'
).onclick=()=>{

    document.getElementById(
        'rangeMin'
    ).value=1;

    document.getElementById(
        'rangeMax'
    ).value=TOTAL_MDS;

    updateRange();

};

const c2=
    makeChart(
        'c2',
        'Punkte je Spieltag',
        md,
        false
    );

const c3=
    makeChart(
        'c3',
        'Tabellenplatzentwicklung',
        league,
        true
    );

const c4=
    makeChart(
        'c4',
        'Spieltagsplatzierung',
        rank,
        true
    );

[c3,c4].forEach(
    chart=>{

        chart.options.scales.y.min=.5;
        chart.options.scales.y.max=11.5;
        chart.options.scales.y.reverse=true;

        chart.options.scales.y.ticks={
            color:'#777',
            stepSize:1,
            precision:0,
            autoSkip:false,
            callback:function(value){

                if(
                    Number.isInteger(value) &&
                    value>=1 &&
                    value<=11
                ){
                    return value;
                }

                return '';

            }
        };

        chart.update();

    }
);

document.getElementById(
    'rangeMin'
).value=1;

document.getElementById(
    'rangeMax'
).value=TOTAL_MDS;

document.getElementById(
    'sliderMaxTick'
).textContent=TOTAL_MDS;

updateRange();

window.addEventListener(
    'scroll',
    hideInteractiveTooltip,
    {
        passive:true
    }
);

window.addEventListener(
    'touchmove',
    hideInteractiveTooltip,
    {
        passive:true
    }
);

window.addEventListener(
    'resize',
    ()=>{

        if(!c1)
            return;

        c1.options.scales.x.ticks.maxTicksLimit=
            isMobile()
            ?
            10
            :
            34;

        c1.options.scales.x.title.display=true;

        c1.update();

        allCharts.forEach(
            chart=>{

                chart.data.datasets.forEach(
                    dataset=>{

                        dataset.pointRadius=
                            isMobile()
                            ?
                            2
                            :
                            4;

                        dataset.pointHoverRadius=
                            isMobile()
                            ?
                            4
                            :
                            6;

                    }
                );

                chart.update();

            }
        );

    }
);

</script>

</body>
</html>
