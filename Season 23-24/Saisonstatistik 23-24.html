<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Season 23-24 | Kicker Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
    --bg:#050505;
    --card:#101010;
    --card2:#151515;
    --line:rgba(255,255,255,.09);
    --text:#f5f5f5;
    --muted:#858585;
    --red:#e30613;
    --red-dark:#a9000b;
    --grid:rgba(255,255,255,.07);
}

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    line-height:1.5;
    min-height:100vh;
}

/* =========================
   NAVIGATION
========================= */

.nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:64px;
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    z-index:1000;
}

.nav-inner{
    max-width:1400px;
    height:100%;
    margin:auto;
    padding:0 30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:700;
    letter-spacing:.5px;
}

.logo span{
    color:var(--red);
}

.nav-links{
    display:flex;
    gap:28px;
}

.nav-links a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.nav-links a:hover{
    color:white;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
    max-width:1400px;
    margin:0 auto;
    padding:145px 30px 65px;
    position:relative;
    text-align:left;
}

.page-label{
    color:var(--red);
    font-size:13px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:16px;
}

h1{
    margin:0;
    font-size:clamp(42px,6vw,72px);
    line-height:.95;
    letter-spacing:-3px;
    font-weight:800;
}

h1 span{
    color:var(--red);
}

.page-description{
    margin:24px 0 0;
    color:var(--muted);
    font-size:15px;
    max-width:650px;
}

/* =========================
   MAIN CONTENT
========================= */

main{
    max-width:1400px;
    margin:0 auto;
    padding:0 30px 80px;
}

.section-label{
    display:flex;
    align-items:center;
    gap:18px;
    width:100%;
    margin:35px 0 18px;
    color:var(--red);
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
}

.section-label::after{
    content:"";
    height:1px;
    background:var(--line);
    flex:1;
}

/* =========================
   CHART CARDS
========================= */

.chart-container{
    width:100%;
    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--card2)
        );
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:none;
    padding:20px 20px 16px;
    margin-bottom:18px;
    aspect-ratio:2.4/1;
    min-height:280px;
    max-height:520px;
    position:relative;
    overflow:hidden;
}

.chart-container::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    right:-130px;
    top:-130px;
    border-radius:50%;
    background:rgba(227,6,19,.045);
    pointer-events:none;
}

.chart-container.interactive{
    padding-bottom:8px;
    margin-bottom:10px;
}

.chart-container.interactive .chart-inner{
    height:100%;
    position:relative;
}

.chart-container.interactive canvas{
    width:100%!important;
    height:100%!important;
}

/* =========================
   RANK CHARTS
========================= */

.rank-chart{
    min-height:420px;
}

.rank-chart canvas{
    width:100%!important;
    height:100%!important;
}

/* =========================
   CHART TOOLTIP
========================= */

.tooltip-custom{
    position:fixed;
    z-index:1000;
    pointer-events:none;
    background:#111;
    color:#f5f5f5;
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    box-shadow:0 8px 25px rgba(0,0,0,.5);
    padding:9px 11px;
    font-size:.78rem;
    line-height:1.5;
    white-space:nowrap;
    opacity:0;
    transition:opacity .08s ease;
}

.tooltip-custom.visible{
    opacity:1;
}

.tooltip-title{
    font-weight:700;
    color:#aaa;
    margin-bottom:3px;
}

.tooltip-row{
    display:flex;
    align-items:center;
    gap:6px;
}

.tooltip-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    flex-shrink:0;
}

/* =========================
   INTERACTIVE CONTROLS
========================= */

.interactive-controls{
    width:100%;
    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--card2)
        );
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:none;
    padding:14px 16px 10px;
    margin-bottom:18px;
}

.controls-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
}

.range-label{
    font-size:.82rem;
    color:#888;
}

.range-label strong{
    color:#f5f5f5;
}

.reset-btn{
    border:1px solid rgba(255,255,255,.12);
    background:#151515;
    color:#aaa;
    border-radius:6px;
    padding:5px 10px;
    font-size:.75rem;
    cursor:pointer;
    transition:.2s;
}

.reset-btn:hover{
    background:#1c1c1c;
    border-color:rgba(227,6,19,.45);
    color:white;
}

.range-slider{
    position:relative;
    height:24px;
}

.slider-track,
.slider-range{
    position:absolute;
    top:10px;
    height:4px;
    border-radius:4px;
}

.slider-track{
    left:0;
    right:0;
    background:#292929;
}

.slider-range{
    background:var(--red);
}

.range-slider input{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:24px;
    margin:0;
    background:none;
    pointer-events:none;
    appearance:none;
}

.range-slider input::-webkit-slider-thumb{
    appearance:none;
    width:17px;
    height:17px;
    border-radius:50%;
    background:var(--red);
    border:2px solid #111;
    box-shadow:0 1px 5px rgba(0,0,0,.6);
    cursor:pointer;
    pointer-events:auto;
}

.range-slider input::-moz-range-thumb{
    width:17px;
    height:17px;
    border:2px solid #111;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 1px 5px rgba(0,0,0,.6);
    cursor:pointer;
    pointer-events:auto;
}

.slider-ticks{
    display:flex;
    justify-content:space-between;
    font-size:.65rem;
    color:#666;
    margin-top:1px;
}

   RANGE TABLE
