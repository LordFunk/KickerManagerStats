<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">UNO Show 'Em No Mercy special cards</title>
  <desc id="desc">Seven illustrated special cards: coloured Draw Four, Wild Draw Six, Wild Draw Ten, Wild Reverse Draw Four, Skip Everyone, Discard All, and Colour Roulette.</desc>
  <defs>
    <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ff7075"/><stop offset="1" stop-color="#d82f4a"/></linearGradient>
    <linearGradient id="yellow" x2="1" y2="1"><stop stop-color="#ffdc65"/><stop offset="1" stop-color="#e9a92d"/></linearGradient>
    <linearGradient id="green" x2="1" y2="1"><stop stop-color="#69d89d"/><stop offset="1" stop-color="#269c70"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#75b4ff"/><stop offset="1" stop-color="#3975d3"/></linearGradient>
    <linearGradient id="wild" x2="1" y2="1"><stop stop-color="#ed5361"/><stop offset=".34" stop-color="#edc64e"/><stop offset=".67" stop-color="#4dbd83"/><stop offset="1" stop-color="#508ee7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1040" height="500" rx="18" fill="#17212b"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">
    <!-- first row -->
    <g transform="translate(45 28)" filter="url(#shadow)"><rect width="190" height="190" rx="15" fill="url(#green)" stroke="#f4f3ed" stroke-width="5"/><text x="15" y="27" font-size="19" text-anchor="start">+4</text><text x="175" y="173" font-size="19" transform="rotate(180 175 173)" text-anchor="start">+4</text><ellipse cx="95" cy="95" rx="65" ry="77" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-width="3" transform="rotate(-28 95 95)"/><text x="95" y="107" font-size="66" fill="#fff">+4</text></g>
    <g transform="translate(295 28)" filter="url(#shadow)"><rect width="190" height="190" rx="15" fill="#20242c" stroke="#f4f3ed" stroke-width="5"/><rect x="5" y="5" width="180" height="180" rx="11" fill="url(#wild)"/><text x="15" y="27" font-size="19" text-anchor="start" fill="#fff">+6</text><text x="175" y="173" font-size="19" transform="rotate(180 175 173)" text-anchor="start" fill="#fff">+6</text><ellipse cx="95" cy="95" rx="65" ry="77" fill="#252a33" fill-opacity=".8" stroke="#fff" stroke-width="3" transform="rotate(-28 95 95)"/><text x="95" y="107" font-size="66" fill="#fff">+6</text></g>
    <g transform="translate(545 28)" filter="url(#shadow)"><rect width="190" height="190" rx="15" fill="#20242c" stroke="#f4f3ed" stroke-width="5"/><rect x="5" y="5" width="180" height="180" rx="11" fill="url(#wild)"/><text x="15" y="27" font-size="19" text-anchor="start" fill="#fff">+10</text><text x="175" y="173" font-size="19" transform="rotate(180 175 173)" text-anchor="start" fill="#fff">+10</text><ellipse cx="95" cy="95" rx="65" ry="77" fill="#252a33" fill-opacity=".8" stroke="#fff" stroke-width="3" transform="rotate(-28 95 95)"/><text x="95" y="107" font-size="54" fill="#fff">+10</text></g>
    <g transform="translate(795 28)" filter="url(#shadow)"><rect width="190" height="190" rx="15" fill="#20242c" stroke="#f4f3ed" stroke-width="5"/><rect x="5" y="5" width="180" height="180" rx="11" fill="url(#wild)"/><text x="15" y="27" font-size="17" text-anchor="start" fill="#fff">↻+4</text><text x="175" y="173" font-size="17" transform="rotate(180 175 173)" text-anchor="start" fill="#fff">↻+4</text><ellipse cx="95" cy="95" rx="65" ry="77" fill="#252a33" fill-opacity=".8" stroke="#fff" stroke-width="3" transform="rotate(-28 95 95)"/><text x="95" y="108" font-size="50" fill="#fff">↻+4</text></g>
    <!-- labels -->
    <g fill="#f4f3ed" font-size="17"><text x="140" y="247">Coloured +4</text><text x="390" y="247">Wild +6</text><text x="640" y="247">Wild +10</text><text x="890" y="247">Wild Reverse +4</text></g>
    <!-- second row -->
    <g transform="translate(170 285)" filter="url(#shadow)"><rect width="190" height="170" rx="15" fill="url(#blue)" stroke="#f4f3ed" stroke-width="5"/><text x="15" y="27" font-size="17" text-anchor="start">»»</text><text x="175" y="153" font-size="17" transform="rotate(180 175 153)" text-anchor="start">»»</text><ellipse cx="95" cy="85" rx="65" ry="65" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-width="3" transform="rotate(-28 95 85)"/><text x="95" y="105" font-size="57" fill="#fff">»»</text></g>
    <g transform="translate(425 285)" filter="url(#shadow)"><rect width="190" height="170" rx="15" fill="url(#red)" stroke="#f4f3ed" stroke-width="5"/><text x="15" y="27" font-size="17" text-anchor="start">⌧</text><text x="175" y="153" font-size="17" transform="rotate(180 175 153)" text-anchor="start">⌧</text><ellipse cx="95" cy="85" rx="65" ry="65" fill="#ffffff" fill-opacity=".18" stroke="#fff" stroke-width="3" transform="rotate(-28 95 85)"/><text x="95" y="106" font-size="66" fill="#fff">⌧</text></g>
    <g transform="translate(680 285)" filter="url(#shadow)"><rect width="190" height="170" rx="15" fill="#20242c" stroke="#f4f3ed" stroke-width="5"/><rect x="5" y="5" width="180" height="160" rx="11" fill="url(#wild)"/><text x="15" y="27" font-size="17" text-anchor="start" fill="#fff">◎</text><text x="175" y="153" font-size="17" transform="rotate(180 175 153)" text-anchor="start" fill="#fff">◎</text><ellipse cx="95" cy="85" rx="65" ry="65" fill="#252a33" fill-opacity=".8" stroke="#fff" stroke-width="3" transform="rotate(-28 95 85)"/><text x="95" y="107" font-size="67" fill="#fff">◎</text></g>
    <g fill="#f4f3ed" font-size="17"><text x="265" y="481">Skip Everyone</text><text x="520" y="481">Discard All</text><text x="775" y="481">Colour Roulette</text></g>
  </g>
</svg>
