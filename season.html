<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kicker Interactive Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
    --bg:#050505;
    --card:#101010;
    --line:rgba(255,255,255,.09);
    --text:#f5f5f5;
    --muted:#858585;
    --red:#e30613;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    background:var(--bg);
}

body{
    margin:0;
    background:
        radial-gradient(circle at 50% -10%,rgba(227,6,19,.12),transparent 38%),
        var(--bg);
    color:var(--text);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:70px 70px;
}

.nav{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 34px;
    background:rgba(5,5,5,.78);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:800;
}

.logo span{
    color:var(--red);
}

.nav-links{
    display:flex;
    gap:5px;
    overflow-x:auto;
    scrollbar-width:none;
}

.nav-links::-webkit-scrollbar{
    display:none;
}

.nav-links a{
    color:#888;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    padding:10px 13px;
    border-radius:999px;
    white-space:nowrap;
}

.nav-links a:hover,
.nav-links a.active{
    color:white;
    background:rgba(255,255,255,.08);
}

.container{
    width:min(1220px,calc(100% - 48px));
    margin:auto;
}

.hero{
    min-height:65vh;
    padding-top:68px;
    display:flex;
    align-items:center;
}

.eyebrow{
    color:var(--red);
    font-size:11px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:15px;
}

.season-title{
    font-size:clamp(75px,13vw,160px);
    line-height:.78;
    letter-spacing:-.08em;
    font-weight:900;
}

.season-title span{
    color:var(--red);
}

.back{
    display:inline-flex;
    margin-top:30px;
    color:#777;
    text-decoration:none;
    font-size:12px;
    padding:10px 15px;
    border:1px solid #282828;
    border-radius:999px;
    transition:.25s;
}

.back:hover{
    color:white;
    border-color:#555;
}

.stats{
    padding-bottom:160px;
}

.stat{
    margin-bottom:120px;
    opacity:0;
    transform:translateY(65px);
    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.22,1,.36,1);
}

.stat.visible{
    opacity:1;
    transform:translateY(0);
}

.stat-heading{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:20px;
}

.stat-heading h2{
    margin:0;
    font-size:clamp(25px,4vw,42px);
    letter-spacing:-.045em;
}

.stat-number{
    color:#444;
    font-size:12px;
    font-weight:800;
}

.card{
    background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);
    border-radius:24px;
    padding:22px;
    box-shadow:0 30px 80px rgba(0,0,0,.28);
}

.chart{
    height:470px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:550px;
}

th{
    color:#555;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    text-align:left;
    padding:11px;
    border-bottom:1px solid var(--line);
}

td{
    padding:11px;
    font-size:13px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

td:last-child,
th:last-child{
    text-align:right;
}

tr:last-child td{
    border-bottom:0;
}

.player-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:8px;
}

.info{
    color:#666;
    font-size:13px;
    line-height:1.6;
}

.images{
    display:grid;
    gap:30px;
}

.images img{
    width:100%;
    display:block;
    border-radius:18px;
    border:1px solid var(--line);
    background:white;
}

footer{
    border-top:1px solid var(--line);
    padding:40px 0 60px;
    color:#444;
    font-size:11px;
}

@media(max-width:850px){

    .nav{
        height:60px;
        padding:0 14px;
    }

    .logo{
        display:none;
    }

    .nav-links{
        width:100%;
    }

    .container{
        width:calc(100% - 28px);
    }

    .hero{
        min-height:55vh;
        padding-top:60px;
    }

    .chart{
        height:340px;
    }

}

@media(max-width:500px){

    .nav-links a{
        font-size:9px;
        padding:8px 9px;
    }

    .chart{
        height:280px;
    }

    .card{
        padding:12px;
        border-radius:18px;
    }

}
</style>
</head>

/* ============================================================
   BUILD SEASON
============================================================ */

function buildSeason(){

    const seasonData =
        data[season];

    if(!seasonData){

        document.getElementById(
            'content'
        ).innerHTML =
            '<p class="info">Season not found.</p>';

        return;

    }


    const players =
        seasonData.players;

    const md =
        seasonData.matchday;

    const position =
        seasonData.position;

    const daily =
        seasonData.daily;


    document.title =
        `Kicker Interactive Stats ${season}`;


    const [startYear,endYear] =
        season.split('-');


    document.getElementById(
        'seasonTitle'
    ).innerHTML =
        `${startYear} / <span>${endYear}</span>`;


    const content =
        document.getElementById('content');


    content.innerHTML = `

        <div class="stat">

            <div class="stat-heading">

                <h2>Saisonpunkte ${season}</h2>

                <div class="stat-number">
                    01
                </div>

            </div>

            <div class="card">

                <div class="chart">
                    <canvas id="cumulative"></canvas>
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-heading">

                <h2>Punkte je Spieltag</h2>

                <div class="stat-number">
                    02
                </div>

            </div>

            <div class="card">

                <div class="chart">
                    <canvas id="matchday"></canvas>
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-heading">

                <h2>Tabellenplatzentwicklung</h2>

                <div class="stat-number">
                    03
                </div>

            </div>

            <div class="card">

                <div class="chart">
                    <canvas id="position"></canvas>
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-heading">

                <h2>Spieltagsplatzierung</h2>

                <div class="stat-number">
                    04
                </div>

            </div>

            <div class="card">

                <div class="chart">
                    <canvas id="daily"></canvas>
                </div>

            </div>

        </div>


        <div class="stat">

            <div class="stat-heading">

                <h2>Endstand</h2>

                <div class="stat-number">
                    05
                </div>

            </div>

            <div class="card">

                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>
                                <th>#</th>
                                <th>Spieler</th>
                                <th>Punkte</th>
                            </tr>

                        </thead>

                        <tbody id="finalTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

    `;


    createCharts(
        players,
        md,
        position,
        daily
    );


    const finalPoints =
        players.map(player=>({

            player,

            points:
                md[player]
                    .reduce(
                        (sum,value)=>sum+value,
                        0
                    )

        }))
        .sort(
            (a,b)=>b.points-a.points
        );


    document.getElementById(
        'finalTable'
    ).innerHTML =

        finalPoints.map((item,index)=>`

            <tr>

                <td>
                    ${index+1}
                </td>

                <td>
                    <span
                        class="player-dot"
                        style="background:${colors[index]}"
                    ></span>
                    ${item.player}
                </td>

                <td>
                    ${item.points}
                </td>

            </tr>

        `).join('');


    document
        .querySelectorAll('.stat')
        .forEach(element=>{
            observer.observe(element);
        });

}


/* ============================================================
   CHARTS
============================================================ */

const selected =
    new Set();


function highlightCharts(charts){

    charts.forEach(chart=>{

        chart.data.datasets.forEach(
            (dataset,index)=>{

                const active =
                    selected.size === 0 ||
                    selected.has(dataset.label);

                const color =
                    colors[index];


                if(active){

                    dataset.borderColor =
                        color;

                    dataset.backgroundColor =
                        color;

                    dataset.pointBackgroundColor =
                        color;

                    dataset.pointBorderColor =
                        color;

                    dataset.borderWidth =
                        selected.has(dataset.label)
                            ? 4
                            : 2;

                    dataset.pointRadius =
                        selected.has(dataset.label)
                            ? 6
                            : 3;

                }else{

                    dataset.borderColor =
                        '#ccc';

                    dataset.backgroundColor =
                        '#ccc';

                    dataset.pointBackgroundColor =
                        '#ccc';

                    dataset.pointBorderColor =
                        '#ccc';

                    dataset.borderWidth = 1;

                    dataset.pointRadius = 3;

                }

            }
        );

        chart.update();

    });

}


function legendClick(e,item,legend){

    const player =
        item.text;


    if(selected.has(player)){

        selected.delete(player);

    }else{

        selected.clear();

        selected.add(player);

    }


    highlightCharts(
        window.seasonCharts
    );

}


function createCharts(
    players,
    md,
    position,
    daily
){

    window.seasonCharts = [];


    const labels =
        Array.from(
            {length:34},
            (_,i)=>i+1
        );


    const cumulative =
        {};

    players.forEach(player=>{

        let total = 0;

        cumulative[player] =
            md[player].map(value=>{

                total += value;

                return total;

            });

    });


    function create(
        id,
        datasetData,
        reverse=false
    ){

        const chart =
            new Chart(
                document.getElementById(id),
                {

                    type:'line',

                    data:{

                        labels,

                        datasets:
                            players.map(
                                (player,index)=>({

                                    label:player,

                                    data:
                                        datasetData[player],

                                    borderColor:
                                        colors[index],

                                    backgroundColor:
                                        colors[index],

                                    pointBackgroundColor:
                                        colors[index],

                                    pointBorderColor:
                                        colors[index],

                                    pointStyle:
                                        'circle',

                                    borderWidth:2,

                                    pointRadius:3,

                                    pointHoverRadius:6,

                                    spanGaps:false

                                })
                            )

                    },

                    options:{

                        responsive:true,

                        maintainAspectRatio:false,

                        interaction:{
                            mode:'index',
                            intersect:false
                        },

                        plugins:{

                            legend:{

                                position:'bottom',

                                labels:{
                                    usePointStyle:true,
                                    pointStyle:'circle',
                                    color:'#aaa',
                                    boxWidth:8,
                                    boxHeight:8,
                                    padding:12
                                },

                                onClick:
                                    legendClick

                            },

                            tooltip:{

                                backgroundColor:
                                    'rgba(10,10,10,.96)',

                                borderColor:
                                    'rgba(255,255,255,.12)',

                                borderWidth:1,

                                callbacks:{

                                    label:
                                        function(context){

                                            if(reverse){

                                                return `${context.dataset.label}: Platz ${context.raw}`;

                                            }

                                            return `${context.dataset.label}: ${context.raw}`;

                                        }

                                }

                            }

                        },

                        scales:{

                            x:{

                                ticks:{
                                    color:'#777',
                                    autoSkip:false
                                },

                                grid:{
                                    color:
                                        'rgba(255,255,255,.055)'
                                }

                            },

                            y:{

                                reverse,

                                beginAtZero:false,

                                ...(reverse ? {

                                    min:.5,

                                    max:
                                        players.length+.5

                                } : {}),

                                ticks:{
                                    color:'#777',
                                    padding:8,
                                    stepSize:
                                        reverse ? 1 : undefined
                                },

                                grid:{
                                    color:
                                        'rgba(255,255,255,.055)'
                                }

                            }

                        }

                    }

                }
            );


        window.seasonCharts.push(chart);

    }


    create(
        'cumulative',
        cumulative
    );


    create(
        'matchday',
        md
    );


    create(
        'position',
        position,
        true
    );


    create(
        'daily',
        daily,
        true
    );

}


/* ============================================================
   REVEAL
============================================================ */

const observer =
    new IntersectionObserver(
        entries=>{

            entries.forEach(entry=>{

                if(entry.isIntersecting){

                    entry.target.classList.add(
                        'visible'
                    );

                }

            });

        },
        {
            threshold:.12
        }
    );

</script>
